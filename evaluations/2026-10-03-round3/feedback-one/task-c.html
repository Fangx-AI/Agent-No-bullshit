<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程资料 · 资料管理</title>
  <style>
    :root { color-scheme: light; --ink:#1e2936; --muted:#697582; --line:#e3e7eb; --paper:#fff; --accent:#315c4c; --accent-soft:#edf5f0; --danger:#a84135; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f4f5f2; color:var(--ink); font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:15px; line-height:1.5; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:default; opacity:.45; }
    button:focus-visible,input:focus-visible { outline:3px solid #a7cbb8; outline-offset:3px; }
    .shell { max-width:1050px; margin:0 auto; padding:38px 28px 70px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:650; font-size:14px; letter-spacing:.06em; }
    .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:9px; background:var(--accent); color:white; }
    .brand svg { width:19px; height:19px; }
    header { margin:44px 0 28px; }
    .eyebrow { margin:0 0 8px; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.12em; }
    h1 { margin:0; font-size:clamp(28px,4vw,38px); font-weight:650; letter-spacing:-.04em; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:0 6px 25px #273c2e06; overflow:hidden; }
    .add-section { padding:28px; border-bottom:1px solid var(--line); }
    label.field-label { display:block; margin-bottom:9px; font-weight:650; font-size:14px; }
    .input-row { display:flex; gap:12px; }
    input[type="text"],input[type="search"] { width:100%; min-width:0; height:46px; border:1px solid #ccd4d1; border-radius:9px; padding:0 14px; color:var(--ink); background:#fff; }
    input::placeholder { color:#8c969f; }
    .primary { flex-shrink:0; min-width:110px; padding:0 20px; background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:9px; font-weight:600; }
    .primary:hover:not(:disabled) { background:#254c3d; }
    .error-text { margin:9px 0 0; color:var(--danger); font-size:13px; }
    .storage-error { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:15px 20px; margin:18px 0 0; border:1px solid #ead7ce; border-radius:10px; background:#fff8f3; color:#873d30; }
    .storage-error p { margin:0; }
    .text-button { color:var(--accent); font-weight:650; background:transparent; border:0; padding:7px 9px; border-radius:6px; white-space:nowrap; }
    .text-button:hover:not(:disabled) { background:#e2eee6; }
    .toolbar { padding:24px 28px 18px; }
    .toolbar-top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:20px; }
    h2 { margin:0; font-size:17px; font-weight:650; }
    .count { color:var(--muted); font-size:13px; font-weight:400; margin-left:10px; }
    .search { position:relative; width:min(310px,50%); }
    .search svg { width:18px; height:18px; position:absolute; left:13px; top:14px; color:#7d8993; pointer-events:none; }
    .search input { height:44px; padding-left:40px; background:#fafbfa; border-color:var(--line); }
    .actions { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .selection { display:flex; align-items:center; gap:20px; min-height:36px; }
    .checkbox-label { display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-size:13px; }
    input[type="checkbox"] { width:17px; height:17px; margin:0; accent-color:var(--accent); flex-shrink:0; cursor:pointer; }
    .selected-count { color:var(--accent); font-size:13px; }
    .delete { padding:8px 13px; color:var(--danger); border:1px solid #e9d4cf; background:#fff; border-radius:8px; font-size:13px; font-weight:650; }
    .delete:hover:not(:disabled) { background:#fff3ef; }
    .consequence { margin:10px 0 0; color:var(--muted); font-size:12px; text-align:right; }
    .list { margin:0; padding:0 28px 12px; list-style:none; }
    .row { display:flex; align-items:center; gap:15px; min-height:78px; padding:16px 14px; border-top:1px solid var(--line); border-radius:0; }
    .row.selected { background:var(--accent-soft); }
    .row-checkbox { padding:6px 0; display:flex; align-items:center; }
    .file-icon { width:35px; height:42px; border:1px solid #d9e3dd; background:#f6f9f7; border-radius:6px; display:grid; place-items:center; color:#678574; flex-shrink:0; }
    .file-icon svg { width:19px; height:19px; }
    .row-content { min-width:0; flex:1; }
    .row-name { display:block; overflow-wrap:anywhere; font-size:14px; font-weight:550; }
    .row-date { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .empty { padding:56px 20px 64px; border-top:1px solid var(--line); text-align:center; }
    .empty svg { width:40px; height:40px; color:#89a092; margin-bottom:12px; }
    .empty h3 { font-size:16px; margin:0 0 7px; font-weight:600; overflow-wrap:anywhere; }
    .empty p { margin:0; color:var(--muted); font-size:13px; }
    .undo-area { margin-top:18px; display:grid; gap:10px; }
    .undo-card { display:flex; align-items:center; justify-content:space-between; gap:14px; border:1px solid #d4e2d9; background:#edf5f0; padding:13px 18px; border-radius:11px; }
    .undo-card p { margin:0; font-size:14px; }
    .undo-card .timer { margin-left:12px; color:#60766a; font-size:12px; white-space:nowrap; }
    .undo-card.finished { background:#f8f9f7; border-color:var(--line); color:var(--muted); }
    footer { color:#7a8681; font-size:12px; margin-top:20px; display:flex; align-items:center; gap:6px; }
    footer svg { width:14px; height:14px; }
    [hidden] { display:none!important; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:640px) {
      .shell { padding:24px 16px 44px; }
      header { margin:32px 0 22px; }
      .add-section { padding:21px 18px; }
      .input-row { gap:8px; }
      .primary { min-width:76px; padding:0 12px; }
      .toolbar { padding:20px 18px 15px; }
      .toolbar-top { display:block; margin-bottom:16px; }
      .search { width:100%; margin-top:15px; }
      .selection { gap:10px; flex-wrap:wrap; }
      .actions { align-items:center; gap:8px; }
      .consequence { text-align:left; margin-top:13px; }
      .list { padding:0 18px 8px; }
      .row { gap:11px; padding:15px 7px; }
      .file-icon { width:30px; height:36px; }
      .undo-card { padding:12px 14px; }
      .undo-card .timer { display:block; margin-left:0; margin-top:3px; }
      .storage-error { font-size:13px; align-items:flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg></span>课程资料</div>
    <header><p class="eyebrow">COURSE LIBRARY</p><h1>资料管理</h1></header>
    <section class="panel" aria-label="课程资料管理">
      <div class="add-section">
        <form id="add-form" novalidate>
          <label class="field-label" for="material-name">资料名</label>
          <div class="input-row"><input id="material-name" type="text" maxlength="120" placeholder="例如：第二讲 · 课前阅读" autocomplete="off" aria-describedby="name-error"><button class="primary" id="add-button" type="submit">新增资料</button></div>
          <p id="name-error" class="error-text" role="alert" hidden></p>
        </form>
        <div id="storage-error" class="storage-error" role="alert" hidden><p id="storage-message"></p><button id="storage-retry" class="text-button" type="button">重试读取</button></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-top"><h2>全部资料<span class="count" id="result-count"></span></h2><div class="search"><label class="sr-only" for="search">搜索资料名</label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="search" type="search" placeholder="搜索资料名" autocomplete="off"></div></div>
        <div class="actions"><div class="selection"><label class="checkbox-label"><input id="select-all" type="checkbox">全选当前结果</label><span id="selected-count" class="selected-count" hidden></span></div><button id="delete-button" class="delete" type="button" disabled>删除已选</button></div>
        <p class="consequence">删除后可在 30 秒内撤销，超时无法恢复。</p>
      </div>
      <ul class="list" id="material-list" aria-label="资料列表"></ul>
    </section>
    <section id="undo-area" class="undo-area" aria-label="删除记录" aria-live="polite" aria-relevant="additions text"></section>
    <footer><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 17h8"/></svg>资料保存在当前浏览器。</footer>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <script>
    'use strict';
    // MODEL START — pure functions, also exercised by the local verification script.
    const UNDO_MS = 30000;
    function emptyState() { return { version:1, nextOrder:0, items:[], pending:[] }; }
    function validItem(item) {
      return item && typeof item.id === 'string' && item.id.length > 0 && typeof item.name === 'string' && item.name.trim().length > 0 && item.name.length <= 120 && Number.isFinite(item.createdAt) && Number.isSafeInteger(item.order) && item.order >= 0;
    }
    function readState(raw) {
      if (raw === null) return emptyState();
      const value = JSON.parse(raw);
      if (!value || value.version !== 1 || !Number.isSafeInteger(value.nextOrder) || value.nextOrder < 0 || !Array.isArray(value.items) || !Array.isArray(value.pending)) throw new Error('存储格式无效');
      const all = [...value.items];
      const batchIds = new Set();
      for (const batch of value.pending) {
        if (!batch || typeof batch.id !== 'string' || !batch.id || batchIds.has(batch.id) || !Number.isFinite(batch.deletedAt) || !Number.isFinite(batch.expiresAt) || batch.expiresAt !== batch.deletedAt + UNDO_MS || !Array.isArray(batch.items) || batch.items.length === 0) throw new Error('删除记录无效');
        batchIds.add(batch.id); all.push(...batch.items);
      }
      const ids = new Set(), orders = new Set();
      for (const item of all) {
        if (!validItem(item) || ids.has(item.id) || orders.has(item.order) || item.order >= value.nextOrder) throw new Error('资料记录无效');
        ids.add(item.id); orders.add(item.order);
      }
      return { version:1, nextOrder:value.nextOrder, items:value.items.map(item => ({...item})), pending:value.pending.map(batch => ({...batch,items:batch.items.map(item => ({...item}))})) };
    }
    function expireBatches(state, now) { return {...state, pending:state.pending.filter(batch => batch.expiresAt > now)}; }
    function addMaterial(state, rawName, now, id) {
      const name = rawName.trim();
      if (!name) throw new Error('请输入资料名。');
      if (name.length > 120) throw new Error('资料名最多 120 个字符。');
      if (!id || state.items.some(item => item.id === id) || state.pending.some(batch => batch.items.some(item => item.id === id))) throw new Error('资料编号重复');
      const next = expireBatches(state, now);
      return {...next, nextOrder:state.nextOrder + 1, items:[{id,name,createdAt:now,order:state.nextOrder}, ...next.items]};
    }
    function deleteMaterials(state, selectedIds, now, batchId) {
      const next = expireBatches(state, now);
      const ids = new Set(selectedIds);
      const removed = next.items.filter(item => ids.has(item.id));
      if (!removed.length) throw new Error('请先勾选要删除的资料。');
      if (!batchId || next.pending.some(batch => batch.id === batchId)) throw new Error('删除记录编号重复');
      return {...next, items:next.items.filter(item => !ids.has(item.id)), pending:[...next.pending,{id:batchId,deletedAt:now,expiresAt:now + UNDO_MS,items:removed}]};
    }
    function undoMaterials(state, batchId, now) {
      const batch = state.pending.find(entry => entry.id === batchId);
      if (!batch || batch.expiresAt <= now) throw new Error('撤销时间已结束，无法恢复。');
      const next = expireBatches(state, now);
      return {...next, items:[...next.items,...batch.items].sort((a,b) => b.order - a.order), pending:next.pending.filter(entry => entry.id !== batchId)};
    }
    // MODEL END

    const STORAGE_KEY = 'course-materials-library-v1';
    const ui = Object.fromEntries(['add-form','material-name','add-button','name-error','storage-error','storage-message','storage-retry','search','select-all','selected-count','delete-button','result-count','material-list','undo-area','announcement'].map(id => [id,document.getElementById(id)]));
    let state = emptyState(), loaded = false, lastRaw = null, dirty = false, failedOperation = null;
    const selection = new Set(), completed = new Map();
    function newId() { return globalThis.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`; }
    function announce(message) { ui.announcement.textContent = message; }
    function showStorageError(message) {
      ui['storage-message'].textContent = message;
      ui['storage-error'].hidden = false;
      ui['storage-retry'].textContent = !loaded ? '重试读取' : failedOperation ? '重试操作' : '重试保存';
    }
    function clearStorageError() { ui['storage-error'].hidden = true; }
    function invalidateRetry() { if (failedOperation) { failedOperation = null; if (!dirty) clearStorageError(); } }
    function persist(next) {
      const serialized = JSON.stringify(next);
      localStorage.setItem(STORAGE_KEY, serialized);
      lastRaw = serialized; dirty = false; clearStorageError();
    }
    function filteredItems() { const query = ui.search.value.trim().toLocaleLowerCase(); return state.items.filter(item => item.name.toLocaleLowerCase().includes(query)); }
    function renderSelection() {
      const visible = filteredItems();
      const selectedVisible = visible.filter(item => selection.has(item.id)).length;
      ui['select-all'].disabled = !loaded || visible.length === 0;
      ui['select-all'].checked = visible.length > 0 && selectedVisible === visible.length;
      ui['select-all'].indeterminate = selectedVisible > 0 && selectedVisible < visible.length;
      ui['selected-count'].hidden = selection.size === 0;
      const hiddenCount = selection.size - selectedVisible;
      ui['selected-count'].textContent = `已选 ${selection.size} 条${hiddenCount ? `（含 ${hiddenCount} 条未显示）` : ''}`;
      ui['delete-button'].disabled = !loaded || selection.size === 0;
      ui['delete-button'].textContent = selection.size ? `删除已选（${selection.size}）` : '删除已选';
      for (const row of ui['material-list'].querySelectorAll('[data-item-id]')) {
        const checked = selection.has(row.dataset.itemId);
        row.classList.toggle('selected',checked); row.querySelector('input').checked = checked;
      }
    }
    function renderList() {
      const visible = filteredItems(), query = ui.search.value.trim();
      ui['result-count'].textContent = query ? `${visible.length} 条结果 / 共 ${state.items.length} 条` : `${state.items.length} 条`;
      ui['material-list'].replaceChildren();
      if (!visible.length) {
        const li = document.createElement('li'); li.className = 'empty';
        li.innerHTML = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 6h18l7 7v29H12V6Z"/><path d="M30 6v8h7M18 23h13M18 29h13M18 35h8"/></svg><h3></h3><p></p>';
        li.querySelector('h3').textContent = !loaded ? '资料暂时无法读取' : query ? `没有找到“${query}”` : '还没有资料';
        li.querySelector('p').textContent = !loaded ? '请使用上方的重试读取。' : query ? '换个关键词试试，或清空搜索查看全部资料。' : '输入资料名，开始整理课程内容。';
        ui['material-list'].append(li);
      }
      for (const item of visible) {
        const li = document.createElement('li'); li.className = 'row'; li.dataset.itemId = item.id;
        const checkboxLabel = document.createElement('label'); checkboxLabel.className = 'row-checkbox';
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.disabled = !loaded; checkbox.setAttribute('aria-label',`选择资料：${item.name}`);
        checkbox.addEventListener('change',() => { invalidateRetry(); if (checkbox.checked) selection.add(item.id); else selection.delete(item.id); renderSelection(); });
        checkboxLabel.append(checkbox);
        const icon = document.createElement('span'); icon.className = 'file-icon'; icon.setAttribute('aria-hidden','true'); icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h8l4 4v14H6V3Z"/><path d="M14 3v5h4M9 12h6M9 16h6"/></svg>';
        const content = document.createElement('div'); content.className = 'row-content';
        const name = document.createElement('span'); name.className = 'row-name'; name.textContent = item.name;
        const date = document.createElement('p'); date.className = 'row-date'; date.textContent = `添加于 ${new Date(item.createdAt).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}`;
        content.append(name,date); li.append(checkboxLabel,icon,content); ui['material-list'].append(li);
      }
      renderSelection();
    }
    function renderUndo() {
      ui['undo-area'].replaceChildren();
      for (const batch of [...state.pending].reverse()) {
        if (batch.expiresAt <= Date.now()) continue;
        const card = document.createElement('div'); card.className = 'undo-card';
        const text = document.createElement('p'); text.append(document.createTextNode(`已删除 ${batch.items.length} 条资料`));
        const timer = document.createElement('span'); timer.className = 'timer'; timer.dataset.expiry = String(batch.expiresAt); timer.setAttribute('aria-hidden','true'); text.append(timer);
        const undo = document.createElement('button'); undo.className = 'text-button'; undo.type = 'button'; undo.textContent = '撤销删除'; undo.setAttribute('aria-label',`撤销删除 ${batch.items.length} 条资料`);
        undo.addEventListener('click',() => {
          const count = state.pending.find(entry => entry.id === batch.id)?.items.length || 0;
          mutate(current => undoMaterials(current,batch.id,Date.now()),() => {
            completed.set(batch.id,{count,type:'restored'}); renderUndo();
          });
        });
        card.append(text,undo); ui['undo-area'].append(card);
      }
      for (const result of completed.values()) {
        const card = document.createElement('div'); card.className = 'undo-card finished';
        const text = document.createElement('p'); text.textContent = result.type === 'restored' ? `已恢复 ${result.count} 条资料。` : `${result.count} 条资料的撤销时间已结束，无法恢复。`;
        card.append(text); ui['undo-area'].append(card);
      }
      updateCountdowns();
    }
    function updateCountdowns() {
      const now = Date.now();
      for (const timer of ui['undo-area'].querySelectorAll('[data-expiry]')) timer.textContent = `剩余 ${Math.max(0,Math.ceil((Number(timer.dataset.expiry) - now) / 1000))} 秒`;
    }
    function render() {
      ui['material-name'].disabled = !loaded; ui['add-button'].disabled = !loaded;
      for (const id of [...selection]) if (!state.items.some(item => item.id === id)) selection.delete(id);
      renderList(); renderUndo();
    }
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const read = readState(raw), now = Date.now();
        state = expireBatches(read,now); lastRaw = raw; loaded = true; dirty = false; failedOperation = null; clearStorageError();
        for (const batch of read.pending) if (batch.expiresAt <= now) completed.set(batch.id,{count:batch.items.length,type:'expired'});
        if (state.pending.length !== read.pending.length) {
          try { persist(state); } catch { dirty = true; showStorageError('浏览器存储更新失败，请重试保存。'); }
        }
      } catch {
        loaded = false; showStorageError('无法读取浏览器中的资料。原数据已保留，请重试读取。');
      }
      render();
    }
    function expire() {
      if (!loaded) return;
      const now = Date.now(), expired = state.pending.filter(batch => batch.expiresAt <= now);
      if (!expired.length) { updateCountdowns(); return; }
      for (const batch of expired) completed.set(batch.id,{count:batch.items.length,type:'expired'});
      state = expireBatches(state,now);
      try {
        if (localStorage.getItem(STORAGE_KEY) !== lastRaw) { completed.clear(); load(); return; }
        persist(state);
      } catch { dirty = true; showStorageError('浏览器存储更新失败，请重试保存。'); }
      renderUndo();
    }
    function mutate(operation,onSuccess) {
      if (!loaded) return false;
      expire();
      try {
        if (localStorage.getItem(STORAGE_KEY) !== lastRaw) {
          completed.clear(); load(); announce('资料已在其他页面更新，请重新操作。'); return false;
        }
        const next = operation(state);
        persist(next); state = next; failedOperation = null; render(); if (onSuccess) onSuccess(); return true;
      } catch (error) {
        if (error.message === '撤销时间已结束，无法恢复。') { expire(); return false; }
        failedOperation = {operation,onSuccess}; showStorageError('未能保存更改，当前操作未完成。请检查浏览器存储权限后重试。'); return false;
      }
    }
    ui['add-form'].addEventListener('submit',event => {
      event.preventDefault();
      const name = ui['material-name'].value.trim();
      if (!name) { ui['name-error'].textContent = '请输入资料名。'; ui['name-error'].hidden = false; ui['material-name'].setAttribute('aria-invalid','true'); ui['material-name'].focus(); return; }
      ui['name-error'].hidden = true; ui['material-name'].removeAttribute('aria-invalid');
      mutate(current => addMaterial(current,name,Date.now(),newId()),() => { ui['material-name'].value = ''; ui['material-name'].focus(); announce(`已新增资料：${name}`); });
    });
    ui['material-name'].addEventListener('input',() => { invalidateRetry(); ui['name-error'].hidden = true; ui['material-name'].removeAttribute('aria-invalid'); });
    ui.search.addEventListener('input',renderList);
    ui['select-all'].addEventListener('change',() => {
      invalidateRetry();
      for (const item of filteredItems()) { if (ui['select-all'].checked) selection.add(item.id); else selection.delete(item.id); }
      renderSelection();
    });
    ui['delete-button'].addEventListener('click',() => {
      if (!selection.size) return;
      mutate(current => deleteMaterials(current,[...selection],Date.now(),newId()),() => { completed.clear(); renderUndo(); });
    });
    ui['storage-retry'].addEventListener('click',() => {
      if (!loaded) { load(); return; }
      if (failedOperation) { const retry = failedOperation; mutate(retry.operation,retry.onSuccess); return; }
      if (dirty) { mutate(current => current); return; }
      clearStorageError(); announce('可以重新操作。');
    });
    window.addEventListener('storage',event => { if (event.key === STORAGE_KEY || event.key === null) { completed.clear(); load(); } });
    window.addEventListener('focus',expire);
    document.addEventListener('visibilitychange',() => { if (!document.hidden) expire(); });
    load(); setInterval(expire,250);
  </script>
</body>
</html>
