<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>课程资料</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#22344f;background:#f3f6fa;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:900px;padding:55px 24px;margin:auto}.eyebrow{font-weight:700;font-size:13px;color:#5272a0;letter-spacing:.12em}h1{font-size:36px;margin:12px 0}p{color:#768498;line-height:1.6}.card{background:white;border:1px solid #dce4ee;border-radius:18px;padding:25px;margin-top:28px}.add{display:flex;gap:10px}input[type=text],input[type=search]{font:inherit;min-width:0;padding:12px 14px;border:1px solid #ccd7e4;border-radius:9px;background:white;color:#22344f}.add input{flex:1}button{font:inherit;cursor:pointer;border:1px solid #c8d6e8;border-radius:9px;padding:11px 16px;background:white;color:#335a8c}button.primary{background:#3f69a0;color:white;border-color:#3f69a0}button.delete{color:#b24545;border-color:#e5c7c7}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #acc6ed;outline-offset:3px}.bar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:25px 0 16px}.search{flex:1}.selection{display:flex;align-items:center;gap:10px;margin:10px 0 16px;flex-wrap:wrap;color:#62738a;font-size:13px}.selection label{display:flex;align-items:center;gap:6px;margin-right:auto}input[type=checkbox]{accent-color:#3f69a0;width:16px;height:16px}.list{list-style:none;margin:0;padding:0;border-top:1px solid #e5ebf3}.row{border-bottom:1px solid #e5ebf3}.row label{padding:17px 5px;display:flex;gap:14px;align-items:center;cursor:pointer}.row span{overflow-wrap:anywhere}.empty{padding:35px 10px;text-align:center;color:#8090a5}.count{font-size:13px;color:#738399;white-space:nowrap}.status{min-height:22px;color:#3c659a;font-size:14px;margin:16px 0 0}.status.error{color:#af4141}.undo-list{margin-top:18px;display:grid;gap:10px}.undo{background:#e7effa;border:1px solid #c8d8ee;border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}.undo small{display:block;color:#6e83a0;font-size:12px;margin-top:3px}.hint{font-size:12px;margin:12px 0 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:640px){main{padding:32px 18px}.card{padding:18px}h1{font-size:30px}.bar{flex-wrap:wrap}.search{width:100%}.selection{gap:8px}.add button{white-space:nowrap}}
</style></head><body><main><div class="eyebrow">我的学习空间</div><h1>课程资料</h1><p>把资料放在一起，随时找到下一份学习内容。</p><section class="card"><form id="add" class="add"><label class="sr-only" for="title">资料名称</label><input id="title" type="text" maxlength="150" placeholder="输入资料名称" required><button class="primary" type="submit">新增资料</button></form><div class="bar"><label class="sr-only" for="search">搜索资料</label><input id="search" class="search" type="search" placeholder="搜索资料名称"><span id="count" class="count"></span></div><div class="selection"><label><input id="select-all" type="checkbox">全选搜索结果</label><span id="selected">已选 0 项</span><button id="delete" class="delete" disabled>删除所选</button></div><ul id="list" class="list"></ul><p class="hint">资料保存在当前浏览器。删除后 30 秒内可撤销，超时无法恢复。</p><p id="status" class="status" role="status" aria-live="polite"></p><button id="retry" hidden>重试读取</button></section><div id="undos" class="undo-list"></div></main>
<script>
'use strict';
const KEY='course-materials-current-v1';const title=document.getElementById('title'),search=document.getElementById('search'),list=document.getElementById('list'),count=document.getElementById('count'),all=document.getElementById('select-all'),selectedLabel=document.getElementById('selected'),remove=document.getElementById('delete'),status=document.getElementById('status'),undos=document.getElementById('undos'),retry=document.getElementById('retry');
let state={items:[],pending:[]},selection=new Set(),blocked=false;
// 资料变更仅计算新状态；存储成功后才应用。
function planDeletion(current,ids,now,groupId){const records=current.items.filter(item=>ids.has(item.id));return {items:current.items.filter(item=>!ids.has(item.id)),pending:current.pending.concat({id:groupId,expires:now+30000,items:records})};}
function planRestore(current,id,now){const group=current.pending.find(item=>item.id===id);if(!group||group.expires<=now)return null;const ids=new Set(current.items.map(item=>item.id));return {items:current.items.concat(group.items.filter(item=>!ids.has(item.id))),pending:current.pending.filter(item=>item.id!==id)};}
function planExpiry(current,now){return {items:current.items,pending:current.pending.filter(group=>group.expires>now)};}
function message(text,error=false){status.textContent=text;status.className='status'+(error?' error':'');}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;message('');return true;}catch(error){message('无法保存，本次更改未应用。请检查浏览器存储后重试。',true);return false;}}
function validRecord(item){return item&&typeof item.id==='string'&&typeof item.name==='string'&&Number.isFinite(item.order);}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!parsed||!Array.isArray(parsed.items)||!Array.isArray(parsed.pending)||!parsed.items.every(validRecord)||!parsed.pending.every(group=>group&&typeof group.id==='string'&&Number.isFinite(group.expires)&&Array.isArray(group.items)&&group.items.every(validRecord)))throw new Error('invalid');state=parsed;}blocked=false;retry.hidden=true;message('');expire();render();}catch(error){blocked=true;retry.hidden=false;message('资料读取失败，暂时无法更改。请重试读取。',true);render();}}
function visibleItems(){const q=search.value.trim().toLocaleLowerCase();return state.items.filter(item=>item.name.toLocaleLowerCase().includes(q)).sort((a,b)=>a.order-b.order||a.id.localeCompare(b.id));}
function updateSelection(){const items=visibleItems();all.disabled=blocked||items.length===0;all.checked=items.length>0&&items.every(item=>selection.has(item.id));all.indeterminate=items.some(item=>selection.has(item.id))&&!all.checked;selectedLabel.textContent='已选 '+selection.size+' 项';remove.disabled=blocked||selection.size===0;}
function render(){list.replaceChildren();const items=visibleItems();count.textContent=search.value.trim()?'找到 '+items.length+' / '+state.items.length+' 项':'共 '+state.items.length+' 项';if(items.length===0){const row=document.createElement('li');row.className='empty';row.textContent=search.value.trim()?'没有匹配的资料，试试其他关键词。':'还没有资料，先添加一份。';list.append(row);}items.forEach(item=>{const row=document.createElement('li');row.className='row';const label=document.createElement('label'),checkbox=document.createElement('input'),name=document.createElement('span');checkbox.type='checkbox';checkbox.checked=selection.has(item.id);checkbox.disabled=blocked;checkbox.addEventListener('change',()=>{if(checkbox.checked)selection.add(item.id);else selection.delete(item.id);updateSelection();});name.textContent=item.name;label.append(checkbox,name);row.append(label);list.append(row);});title.disabled=blocked;document.querySelector('#add button').disabled=blocked;updateSelection();renderUndos();}
function renderUndos(){undos.replaceChildren();const now=Date.now();state.pending.filter(group=>group.expires>now).forEach(group=>{const box=document.createElement('div');box.className='undo';const description=document.createElement('div'),small=document.createElement('small'),button=document.createElement('button');description.textContent='已删除 '+group.items.length+' 项资料';small.textContent=Math.ceil((group.expires-now)/1000)+' 秒内可撤销';description.append(small);button.textContent='撤销删除';button.disabled=blocked;button.addEventListener('click',()=>undo(group.id));box.append(description,button);undos.append(box);});}
function expire(){const now=Date.now(),expired=state.pending.filter(group=>group.expires<=now);if(!expired.length)return;if(persist(planExpiry(state,now)))message(expired.reduce((sum,group)=>sum+group.items.length,0)+' 项资料的撤销时间已结束，无法恢复。');}
function undo(id){const group=state.pending.find(item=>item.id===id);if(!group)return;const next=planRestore(state,id,Date.now());if(!next){expire();renderUndos();message('撤销时间已结束，这批资料无法恢复。',true);return;}if(persist(next)){selection.clear();render();message('已恢复 '+group.items.length+' 项资料。');}}
document.getElementById('add').addEventListener('submit',event=>{event.preventDefault();if(blocked)return;const name=title.value.trim();if(!name){message('请填写资料名称。',true);title.focus();return;}const record={id:crypto.randomUUID(),name,order:Date.now()};if(persist({items:state.items.concat(record),pending:state.pending})){title.value='';render();message('已添加「'+name+'」。');title.focus();}});
search.addEventListener('input',()=>{selection.clear();render();});all.addEventListener('change',()=>{selection=new Set(all.checked?visibleItems().map(item=>item.id):[]);render();});remove.addEventListener('click',()=>{if(blocked||!selection.size)return;const next=planDeletion(state,selection,Date.now(),crypto.randomUUID()),deleted=next.pending.at(-1).items.length;if(persist(next)){selection.clear();render();message('已删除 '+deleted+' 项，可在 30 秒内撤销。');}});retry.addEventListener('click',load);
setInterval(()=>{if(blocked)return;expire();renderUndos();},250);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!blocked){expire();renderUndos();}});load();
</script></body></html>
