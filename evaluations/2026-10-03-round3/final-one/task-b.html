<style>

ign-items:center;opacity:.2;position:absolute;inset:0;justify-content:center}.wave span{width:5px;height:var(--h);border-radius:5px;background:#c8bdff}.mic-disc{width:115px;height:115px;border-radius:50%;background:#2f3842;border:1px solid #5f5b7c;display:grid;place-items:center;transform:rotate(-8deg);box-shadow:0 18px 35px #0004}.mic-disc svg{width:52px;height:65px;color:#d2c8ff}.hero-number{position:absolute;bottom:-3px;right:0;font-size:10px;letter-spacing:2px;color:#82909d}.content-heading{display:flex;align-items:center;justify-content:space-between;margin:32px 0 17px}.content-heading h2{margin:0;font-size:21px}.content-heading span{font-size:12px;color:var(--muted)}.booking{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 260px;gap:18px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:24px}.step-label{display:flex;gap:9px;align-items:center;margin:0 0 20px;font-size:15px;font-weight:700}.step-number{font-size:10px;color:var(--purple);background:var(--purple-light);border-radius:7px;display:grid;place-items:center;width:25px;height:25px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.monthbar strong{font-size:15px}.month-nav{display:flex;gap:6px}.icon-button{border:1px solid var(--line);background:white;border-radius:8px;width:29px;height:29px;color:#646d78;font-size:18px}.icon-button:hover:not(:disabled){background:var(--purple-light);color:var(--purple)}.icon-button:disabled{opacity:.3}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays{color:#8d939b;font-size:11px;text-align:center;margin-bottom:7px}.weekdays span{padding:5px 0}.calendar button{border:0;border-radius:10px;height:38px;background:transparent;position:relative;font-size:12px}.calendar button:after{content:"";position:absolute;width:3px;height:3px;bottom:4px;left:calc(50% - 1.5px);background:#9c8fd6;border-radius:50%}.calendar button:hover:not(:disabled){background:var(--purple-light)}.calendar button.selected{background:var(--purple);color:white;box-shadow:0 5px 12px #6c57d92b}.calendar button.selected:after{background:#fff}.calendar button:disabled{color:#c2c5cc}.calendar button:disabled:after{display:none}.date-help{font-size:11px;color:var(--muted);margin:16px 0 21px;line-height:1.7}.slot-heading{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:18px;margin-bottom:12px}.slot-heading strong{font-size:12px}.slot-heading span{font-size:10px;color:var(--muted)}.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.slot{background:white;border:1px solid var(--line);border-radius:10px;min-height:41px;font-size:12px;color:#68717b}.slot:hover:not(:disabled){border-color:var(--purple);color:var(--purple)}.slot.selected{background:var(--purple-light);border-color:var(--purple);color:var(--purple);font-weight:700}.slot:disabled{background:#f7f7f7;color:#b6bac1;text-decoration:line-through}.field{margin-bottom:20px}.field label{font-size:12px;font-weight:600;display:block;margin-bottom:8px}.field input{width:100%;border:1px solid var(--line);background:#fcfcfb;border-radius:10px;padding:12px;min-width:0;outline:none;transition:.15s}.field input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6c57d911}.field input[aria-invalid="true"]{border-color:#bc5761}.field input::placeholder{color:#a5a9ae}.field-error{color:#ae3f4c;font-size:11px;margin-top:7px;min-height:0}.selection{background:#f7f6fc;border:1px dashed #d9d4f0;border-radius:11px;padding:14px;display:flex;gap:12px;align-items:center;margin:8px 0 21px}.selection svg{width:20px;flex:none;color:var(--purple)}.selection strong{display:block;font-size:12px;line-height:1.6}.selection small{font-size:10px;color:var(--muted)}.submit{width:100%;background:var(--purple);border:0;border-radius:10px;color:white;min-height:46px;font-weight:600;box-shadow:0 6px 15px #6c57d921}.submit:hover:not(:disabled){background:#5b47c5}.submit:disabled{opacity:.7}.submit-note{font-size:11px;color:#78808b;line-height:1.8;margin:10px 0 0}.form-status{font-size:12px;line-height:1.7;margin-top:12px;color:#ae3f4c}.form-status:empty{display:none}.podcast{padding:19px}.cover{border-radius:13px;aspect-ratio:1.24;background:#c6bddf;position:relative;overflow:hidden;padding:20px;color:#282239;display:flex;flex-direction:column;justify-content:space-between}.cover:before,.cover:after{content:"";position:absolute;inset:auto -30px -98px auto;width:220px;height:220px;border-radius:50%;border:33px solid #a79bc5;opacity:.7}.cover:after{inset:-92px auto auto -120px;border-color:#e5e0ef}.cover span,.cover strong,.cover em{position:relative;z-index:1}.cover span{font-size:9px;letter-spacing:3px}.cover strong{font-size:37px;line-height:1.1;letter-spacing:3px}.cover em{font-style:normal;font-size:10px;letter-spacing:1px}.podcast h3{font-size:16px;margin:19px 0 8px}.podcast p{font-size:11px;line-height:1.9;color:var(--muted);margin:0}.details{margin:18px 0 0;border-top:1px solid var(--line);padding-top:6px}.details div{display:flex;justify-content:space-between;font-size:11px;margin-top:14px}.details dt{color:var(--muted)}.details dd{margin:0;font-weight:600}.preview{margin-top:20px;background:#edf5ef;border:1px solid #cbded1;border-radius:16px;padding:21px;scroll-margin:20px}.preview[hidden]{display:none}.preview-top{display:flex;align-items:center;gap:9px;color:#38624a}.check{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#d6e7dc;font-size:14px}.preview h3{font-size:14px;margin:0}.preview p{margin:9px 0 0;color:#5d7666;font-size:12px}.preview dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:20px 0 0}.preview dt{font-size:10px;color:#6a8271;margin-bottom:5px}.preview dd{margin:0;font-size:12px;font-weight:600;overflow-wrap:anywhere}.footer{display:flex;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:#91969c;font-size:10px;letter-spacing:.3px}.sr{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}.nojs{padding:16px;background:#f5dedc;color:#7a3030}.placeholder{height:38px}.calendar-empty{font-size:12px;line-height:1.8;color:var(--muted);grid-column:1/-1}
@media(max-width:1050px){.booking{grid-template-columns:1fr 1fr}.podcast{grid-column:1/-1;display:grid;grid-template-columns:180px 1fr;gap:22px}.cover{grid-row:1/4}.podcast h3{margin-top:4px}.podcast .details{margin-top:0}.hero-art{min-width:180px}.hero h1{font-size:33px}}@media(max-width:650px){header{height:73px;padding:0 20px}.brand small{display:none}.shell{padding:0 16px 30px}.hero{padding:29px 26px;border-radius:20px}.hero h1{font-size:30px}.hero-art{display:none}.hero p{font-size:12px}.booking{grid-template-columns:1fr;gap:14px}.content-heading{margin-top:24px}.content-heading h2{font-size:18px}.content-heading span{font-size:10px}.card{padding:22px}.calendar button{height:42px}.podcast{grid-column:auto;grid-template-columns:115px 1fr;gap:14px;padding:17px}.cover{padding:13px}.cover strong{font-size:25px}.cover span{font-size:7px}.cover em{font-size:8px}.podcast h3{font-size:14px;margin-bottom:0}.podcast p{font-size:10px}.details div{font-size:10px;margin-top:8px}.preview dl{grid-template-columns:1fr 1fr}.footer{font-size:9px}}
</style>
</head>
<body>
<noscript><div class="nojs">请启用 JavaScript 后选择日期并生成预约预览。</div></noscript>
<header><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>声间<small>PODCAST</small></div><div class="header-label"><span class="dot"></span>嘉宾预约</div></header>
<main class="shell">
<section class="hero"><div><div class="eyebrow">SHENG JIAN PODCAST</div><h1>预约你的<br>播客对谈。</h1></div><div class="hero-art" aria-hidden="true"><div class="wave"><span style="--h:25px"></span><span style="--h:43px"></span><span style="--h:72px"></span><span style="--h:36px"></span><span style="--h:91px"></span><span style="--h:60px"></span><span style="--h:120px"></span><span style="--h:52px"></span><span style="--h:68px"></span><span style="--h:98px"></span><span style="--h:41px"></span><span style="--h:77px"></span><span style="--h:25px"></span><span style="--h:58px"></span><span style="--h:36px"></span><span style="--h:85px"></span><span style="--h:55px"></span><span style="--h:25px"></span><span style="--h:40px"></span></div><div class="mic-disc"><svg fill="none" viewBox="0 0 64 80"><rect x="23" y="6" width="18" height="39" rx="9" stroke="currentColor" stroke-width="3"/><path d="M15 34v6a17 17 0 0034 0v-6M32 57v13M21 71h22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div><div class="hero-number">声间 · 来聊一聊</div></div></section>
<div class="content-heading"><h2>安排一场对谈</h2></div>
<div class="booking">
<section class="card" aria-labelledby="date-title"><h3 class="step-label" id="date-title"><span class="step-number">01</span>选择日期与时段</h3><div class="monthbar"><strong id="month-label"></strong><div class="month-nav"><button class="icon-button" id="prev-month" type="button" aria-label="上个月">‹</button><button class="icon-button" id="next-month" type="button" aria-label="下个月">›</button></div></div><div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar" id="calendar" role="group" aria-label="选择预约日期"></div><p class="date-help">选择未来60天内的可预约日期。</p><div class="slot-heading"><strong id="slot-label">可选时段</strong><span>北京时间</span></div><div class="slots" id="slots" role="group" aria-label="选择预约时段"></div></section>
<section class="card" aria-labelledby="contact-title"><h3 class="step-label" id="contact-title"><span class="step-number">02</span>留下你的联系方式</h3><form id="booking-form" novalidate><div class="field"><label for="name">姓名</label><input id="name" name="name" placeholder="我们该如何称呼你" autocomplete="name" maxlength="40" required aria-describedby="name-error"><div class="field-error" id="name-error"></div></div><div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" maxlength="120" required aria-describedby="email-error"><div class="field-error" id="email-error"></div></div><div class="selection"><svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M7 3v4M17 3v4M3 10h18M7 14h3M14 14h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><div><strong id="selection-text">请选择一个时段</strong></div></div><button class="submit" id="submit" type="submit">提交预约（演示）</button><p class="submit-note">提交只生成预约预览，不会实际预约。</p><div class="form-status" id="form-status" role="status" aria-live="polite"></div></form></section>
<aside class="card podcast"><div class="cover" aria-hidden="true"><span>SHENG JIAN PODCAST</span><strong>声 间<br>对 谈</strong><em>人与故事之间</em></div><h3>对谈安排</h3><dl class="details"><div><dt>录制方式</dt><dd>线上对谈</dd></div><div><dt>对谈时长</dt><dd>30分钟</dd></div></dl></aside>
</div>
<section class="preview" id="preview" hidden tabindex="-1" aria-labelledby="preview-title"><div class="preview-top"><span class="check" aria-hidden="true">✓</span><h3 id="preview-title">预约预览已生成</h3></div><p>修改日期、时段或联系方式后，可重新提交预览。</p><dl><div><dt>日期</dt><dd id="preview-date"></dd></div><div><dt>时段 · 北京时间</dt><dd id="preview-slot"></dd></div><div><dt>姓名</dt><dd id="preview-name"></dd></div><div><dt>邮箱</dt><dd id="preview-email"></dd></div></dl></section>
<footer class="footer"><span>声间 · 让故事被听见</span><span>SHENG JIAN / PODCAST</span></footer>
</main>
<script>
const BookingCore = (() => {
  const dayMs = 86400000;
  function parse(key) { return new Date(key + 'T12:00:00Z'); }
  function key(date) { return date.toISOString().slice(0,10); }
  function addDays(value, days) { return key(new Date(parse(value).getTime() + days * dayMs)); }
  function today() { const p = new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const value = t => p.find(x => x.type === t).value; return value('year')+'-'+value('month')+'-'+value('day'); }
  function slots(date) { const d = parse(date); if(d.getUTCDay()===0) return []; const times=d.getUTCDay()===6?['10:00','14:00']:['10:00','11:00','14:00','16:00']; return times.map((start,i)=>({start,available:(d.getUTCDate()+i)%5!==0})); }
  function available(date, base) { return date > base && date <= addDays(base,60) && slots(date).some(s=>s.available); }
  function validate({date,slot,name,email},base) { if(!available(date,base) || !slots(date).some(s=>s.start===slot && s.available)) return {field:'slot',message:'请选择一个可预约的时段。'}; if(!name.trim()) return {field:'name',message:'请填写姓名。'}; if(name.trim().length>40) return {field:'name',message:'姓名请控制在40个字以内。'}; if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim()) || email.trim().length>120) return {field:'email',message:'请输入完整邮箱，例如 you@example.com。'}; return null; }
  function endTime(start) { const [h,m]=start.split(':').map(Number); const total=h*60+m+30; return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0'); }
  return {parse,key,addDays,today,slots,available,validate,endTime};
})();
(() => {
  const $ = id => document.getElementById(id);
  let base=BookingCore.today(), selectedDate=BookingCore.addDays(base,1), selectedSlot='', revision=0, loading=false;
  while(!BookingCore.available(selectedDate,base)) selectedDate=BookingCore.addDays(selectedDate,1);
  let month=new Date(BookingCore.parse(selectedDate)); month.setUTCDate(1);
  const formatter=new Intl.DateTimeFormat('zh-CN',{timeZone:'UTC',month:'long',day:'numeric',weekday:'long'});
  function dateLabel(d) { return formatter.format(BookingCore.parse(d)); }
  function invalidate() { revision++; loading=false; $('submit').disabled=false; $('submit').textContent='提交预约（演示）'; $('preview').hidden=true; $('form-status').textContent=''; }
  function selection() { $('selection-text').textContent=selectedSlot ? dateLabel(selectedDate)+' · '+selectedSlot+'–'+BookingCore.endTime(selectedSlot) : dateLabel(selectedDate)+' · 请选择时段'; }
  function renderSlots() { $('slot-label').textContent=dateLabel(selectedDate); $('slots').replaceChildren(); for(const s of BookingCore.slots(selectedDate)) { const b=document.createElement('button'); b.type='button'; b.className='slot'+(s.start===selectedSlot?' selected':''); b.disabled=!s.available; b.textContent=s.start; b.setAttribute('aria-pressed',String(s.start===selectedSlot)); b.setAttribute('aria-label',s.start+(s.available?'，可预约':'，不可预约')); b.addEventListener('click',()=>{invalidate();selectedSlot=s.start;renderSlots();selection();}); $('slots').append(b); } selection(); }
  function renderCalendar() { const y=month.getUTCFullYear(), m=month.getUTCMonth(); $('month-label').textContent=y+'年 '+(m+1)+'月'; const first=new Date(Date.UTC(y,m,1,12)), count=new Date(Date.UTC(y,m+1,0,12)).getUTCDate(), offset=(first.getUTCDay()+6)%7; $('calendar').replaceChildren(); for(let i=0;i<offset;i++){const p=document.createElement('span');p.className='placeholder';$('calendar').append(p);} for(let day=1;day<=count;day++){const d=BookingCore.key(new Date(Date.UTC(y,m,day,12)));const b=document.createElement('button');b.type='button';b.textContent=day;b.className=d===selectedDate?'selected':'';b.disabled=!BookingCore.available(d,base);b.setAttribute('aria-pressed',String(d===selectedDate));b.setAttribute('aria-label',dateLabel(d)+(b.disabled?'，不可预约':'，可预约'));b.addEventListener('click',()=>{invalidate();selectedDate=d;selectedSlot='';renderCalendar();renderSlots();});$('calendar').append(b);} const start=BookingCore.parse(base),last=BookingCore.parse(BookingCore.addDays(base,60));$('prev-month').disabled=y*12+m<=start.getUTCFullYear()*12+start.getUTCMonth();$('next-month').disabled=y*12+m>=last.getUTCFullYear()*12+last.getUTCMonth(); }
  $('prev-month').addEventListener('click',()=>{month.setUTCMonth(month.getUTCMonth()-1);renderCalendar();});
  $('next-month').addEventListener('click',()=>{month.setUTCMonth(month.getUTCMonth()+1);renderCalendar();});
  for(const id of ['name','email']) $(''+id).addEventListener('input',()=>{invalidate();$(id+'-error').textContent='';$(id).removeAttribute('aria-invalid');});
  $('booking-form').addEventListener('submit',event=>{
    event.preventDefault(); if(loading) return;
    for(const id of ['name','email']) {$(id+'-error').textContent='';$(id).removeAttribute('aria-invalid');}
    const snapshot={date:selectedDate,slot:selectedSlot,name:$('name').value.trim(),email:$('email').value.trim()};
    base=BookingCore.today(); const error=BookingCore.validate(snapshot,base);
    if(error){$('preview').hidden=true;if(error.field==='slot'){$('form-status').textContent=error.message;const first=$('slots').querySelector('button:not(:disabled)');if(first)first.focus();renderCalendar();}else{$(error.field+'-error').textContent=error.message;$(error.field).setAttribute('aria-invalid','true');$(error.field).focus();}$('form-status').textContent=error.field==='slot'?error.message:'';return;}
    loading=true;const ticket=++revision;$('submit').disabled=true;$('submit').textContent='正在生成预览…';$('form-status').textContent='';
    setTimeout(()=>{if(ticket!==revision)return;loading=false;$('submit').disabled=false;$('submit').textContent='重新提交预览';$('preview-date').textContent=dateLabel(snapshot.date);$('preview-slot').textContent=snapshot.slot+'–'+BookingCore.endTime(snapshot.slot);$('preview-name').textContent=snapshot.name;$('preview-email').textContent=snapshot.email;$('preview').hidden=false;$('preview').focus();},550);
  });
  renderCalendar();renderSlots();
})();
</script>
</body>
</html>
