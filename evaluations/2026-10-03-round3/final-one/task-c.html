<script>
const MaterialCore = (() => {
  function decode(raw) { if(raw===null)return null;const value=JSON.parse(raw);if(value.v!==1 || !Array.isArray(value.items) || !Array.isArray(value.pending))throw Error('invalid');const valid=item=>item&&typeof item.id==='string'&&typeof item.name==='string'&&Number.isFinite(item.createdAt);if(!value.items.every(valid)||!value.pending.every(batch=>typeof batch.id==='string'&&Number.isFinite(batch.expiresAt)&&Array.isArray(batch.items)&&batch.items.every(valid)))throw Error('invalid');return value; }
  function expire(state, now) { return {next:{...state,pending:state.pending.filter(batch=>batch.expiresAt>now)},expired:state.pending.filter(batch=>batch.expiresAt<=now)}; }
  function add(state,item) { return {...state,items:[item,...state.items]}; }
  function remove(state,ids,batchId,now) { const selected=new Set(ids),removed=state.items.filter(item=>selected.has(item.id));return {next:{...state,items:state.items.filter(item=>!selected.has(item.id)),pending:removed.length?[...state.pending,{id:batchId,items:removed,expiresAt:now+30000}]:state.pending},count:removed.length}; }
  function undo(state,id,now) { const batch=state.pending.find(item=>item.id===id);if(!batch || batch.expiresAt<=now)return {next:expire(state,now).next,count:0};const existing=new Set(state.items.map(item=>item.id));const restored=batch.items.filter(item=>!existing.has(item.id));return {next:{...state,items:[...state.items,...restored].sort((a,b)=>b.createdAt-a.createdAt),pending:state.pending.filter(item=>item.id!==id)},count:restored.length}; }
  function search(items,query) { const q=query.trim().toLocaleLowerCase();return items.filter(item=>item.name.toLocaleLowerCase().includes(q)); }
  return {decode,expire,add,remove,undo,search};
})();
(() => {
  const $=id=>document.getElementById(id), storageKey='keji-materials-v1';
  const uid=()=>globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
  let state={v:1,items:[],pending:[]},selected=new Set(),ready=false,failed=null;
  const seed=()=>({v:1,items:['第1讲 · 学习方法与课程导读','第2讲 · 核心概念与知识框架','课程阅读清单','练习题与参考答案','小组讨论 · 课堂记录','期末复习提纲'].map((name,i)=>({id:'demo-'+i,name,createdAt:Date.now()-(i+1)*86400000})),pending:[]});
  function notice(text){$('live-message').textContent=text;}
  function error(text,mode){$('storage-error').hidden=false;$('storage-error-text').textContent=text;$('retry-storage').textContent=mode==='load'?'重新加载':'重试保存';$('retry-storage').dataset.mode=mode;$('storage-status').textContent='保存未完成';}
  function clearError(){$('storage-error').hidden=true;failed=null;$('storage-status').textContent='已保存在当前浏览器';}
  function persist(next){localStorage.setItem(storageKey,JSON.stringify(next));}
  function readLatest(){const value=MaterialCore.decode(localStorage.getItem(storageKey));return value===null?state:value;}
  function cleanSelection(){const ids=new Set(state.items.map(item=>item.id));selected=new Set([...selected].filter(id=>ids.has(id)));}
  function visible(){return MaterialCore.search(state.items,$('search').value);}
  function render(){
    cleanSelection();const items=visible();$('total-count').textContent=state.items.length;$('visible-count').textContent=items.length;$('material-list').replaceChildren();
    for(const item of items){const row=document.createElement('tr');row.className=selected.has(item.id)?'selected':'';const cell=document.createElement('td');cell.className='checkcol';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=selected.has(item.id);checkbox.disabled=!ready;checkbox.setAttribute('aria-label','选择 '+item.name);checkbox.addEventListener('change',()=>{checkbox.checked?selected.add(item.id):selected.delete(item.id);render();});cell.append(checkbox);const name=document.createElement('td');const wrap=document.createElement('div');wrap.className='file-name';const icon=document.createElement('span');icon.className='file-icon';icon.setAttribute('aria-hidden','true');icon.innerHTML='<svg fill="none" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3zM14 3v5h4M9 12h6M9 16h5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>';const title=document.createElement('span');title.className='file-title';title.textContent=item.name;wrap.append(icon,title);name.append(wrap);const date=document.createElement('td');date.className='file-date';date.textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(item.createdAt));const type=document.createElement('td');type.className='typecell';const pill=document.createElement('span');pill.className='type-pill';pill.textContent='课程资料';type.append(pill);row.append(cell,name,date,type);$('material-list').append(row);}
    const checked=items.filter(item=>selected.has(item.id)).length;$('select-all').checked=!!items.length&&checked===items.length;$('select-all').indeterminate=checked>0&&checked<items.length;$('select-all').disabled=!ready||!items.length;
    const hidden=selected.size-checked;$('selection-status').replaceChildren();if(selected.size){const strong=document.createElement('strong');strong.textContent='已选 '+selected.size+' 份资料';$('selection-status').append(strong);if(hidden)$('selection-status').append(document.createTextNode('，其中 '+hidden+' 份不在当前搜索结果中'));}else $('selection-status').textContent='勾选资料后可批量删除';
    $('delete-selected').disabled=!ready||!selected.size;$('delete-label').textContent=selected.size?'删除已选（'+selected.size+'）':'删除已选';$('add-button').disabled=!ready;$('material-name').disabled=!ready;
    $('empty').hidden=items.length>0;$('empty-title').textContent=state.items.length?'没有找到匹配的资料':'还没有课程资料';$('empty-detail').textContent=state.items.length?'试试其他关键词，或清空搜索。':'在上方输入资料名，添加你的第一份资料。';$('list-count').textContent=$('search').value.trim()?'找到 '+items.length+' 份 / 共 '+state.items.length+' 份资料':'共 '+state.items.length+' 份资料';$('clear-search').hidden=!$('search').value;renderUndo();
  }
  function renderUndo(){const active=state.pending.filter(batch=>batch.expiresAt>Date.now());const present=new Map([...$('undo-list').children].map(node=>[node.dataset.id,node]));for(const batch of active){let card=present.get(batch.id);if(!card){card=document.createElement('div');card.className='undo-card';card.dataset.id=batch.id;const text=document.createElement('div'),title=document.createElement('strong'),countdown=document.createElement('p'),button=document.createElement('button');title.textContent='已删除 '+batch.items.length+' 份资料';countdown.className='countdown';text.append(title,countdown);button.type='button';button.textContent='撤销';button.addEventListener('click',()=>undoBatch(batch.id));card.append(text,button);$('undo-list').append(card);}card.querySelector('.countdown').textContent='还可撤销 '+Math.ceil((batch.expiresAt-Date.now())/1000)+' 秒';card.querySelector('button').disabled=!ready;present.delete(batch.id);}for(const node of present.values())node.remove();}
  function commit(next,message,onSuccess,operation){try{persist(next);state=next;ready=true;clearError();if(onSuccess)onSuccess();render();if(message)notice(message);return true;}catch(e){failed={operation};ready=false;error('资料保存失败，当前操作尚未完成。请重试。','save');render();return false;}}
  function mutate(operation,retry=false){if(!ready&&!retry)return;try{const current=MaterialCore.expire(readLatest(),Date.now()).next;const result=operation(current);return commit(result.next,result.message,result.onSuccess,operation);}catch(e){ready=false;failed=null;error('无法读取已保存的资料。请重新加载。','load');render();}}
  function load(){try{let next=MaterialCore.decode(localStorage.getItem(storageKey));if(next===null)next=seed();const cleaned=MaterialCore.expire(next,Date.now());persist(cleaned.next);state=cleaned.next;ready=true;clearError();render();if(cleaned.expired.length)notice(cleaned.expired.reduce((n,b)=>n+b.items.length,0)+' 份资料的撤销时间已过，无法恢复。');}catch(e){ready=false;error('无法读取或保存浏览器中的资料。请重新加载。','load');render();}}
  $('add-form').addEventListener('submit',event=>{event.preventDefault();const name=$('material-name').value.trim();if(!name){$('add-error').textContent='请先填写资料名。';$('material-name').setAttribute('aria-invalid','true');$('material-name').focus();return;}if(name.length>100){$('add-error').textContent='资料名请控制在100个字以内。';return;}const item={id:uid(),name,createdAt:Date.now()};mutate(current=>({next:MaterialCore.add(current,item),message:'已新增「'+name+'」。',onSuccess:()=>{$('material-name').value='';$('add-error').textContent='';$('material-name').removeAttribute('aria-invalid');$('search').value='';$('material-name').focus();}}));});
  $('material-name').addEventListener('input',()=>{$('add-error').textContent='';$('material-name').removeAttribute('aria-invalid');});
  $('search').addEventListener('input',render);$('clear-search').addEventListener('click',()=>{$('search').value='';render();$('search').focus();});
  $('select-all').addEventListener('change',()=>{for(const item of visible())$('select-all').checked?selected.add(item.id):selected.delete(item.id);render();});
  $('delete-selected').addEventListener('click',()=>{const ids=[...selected],batchId=uid();mutate(current=>{const result=MaterialCore.remove(current,ids,batchId,Date.now());return {...result,message:result.count?'已删除 '+result.count+' 份资料，可在30秒内撤销。':'所选资料已不存在，列表已更新。',onSuccess:()=>{selected.clear();}};});});
  function undoBatch(id){mutate(current=>{const result=MaterialCore.undo(current,id,Date.now());return {...result,message:result.count?'已恢复 '+result.count+' 份资料。':'撤销未成功：撤销时间已过或该批资料已恢复。'};});}
  $('retry-storage').addEventListener('click',()=>{if($('retry-storage').dataset.mode==='load'||!failed){load();return;}mutate(failed.operation,true);});
  window.addEventListener('storage',event=>{if(event.key===storageKey||event.key===null){failed=null;load();notice('资料已更新。');}});
  setInterval(()=>{const now=Date.now(),cleaned=MaterialCore.expire(state,now);if(!ready){if(cleaned.expired.length){state=cleaned.next;render();notice(cleaned.expired.reduce((n,b)=>n+b.items.length,0)+' 份资料的撤销时间已过，无法恢复。');}else renderUndo();return;}if(cleaned.expired.length){const count=cleaned.expired.reduce((n,b)=>n+b.items.length,0);const message=count+' 份资料的撤销时间已过，无法恢复。';const operation=current=>({next:MaterialCore.expire(current,Date.now()).next,message});if(!commit(cleaned.next,message,null,operation)){state=cleaned.next;render();notice(message);}}else renderUndo();},250);
  load();
})();
</script>
</body>
</html>
