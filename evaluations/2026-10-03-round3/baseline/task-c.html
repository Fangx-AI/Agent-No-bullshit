<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课架 · 课程资料</title><style>
:root{--ink:#202735;--muted:#748093;--line:#e2e6ee;--accent:#3c57ac}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button,input{border:1px solid var(--line);border-radius:8px;min-height:42px;padding:9px 13px}button{background:#fff;color:var(--ink);cursor:pointer}button:hover:not(:disabled){background:#f0f3fa}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #b1c1f1;outline-offset:3px}input{color:var(--ink);background:#fff}input[type=checkbox]{min-height:auto;accent-color:var(--accent);width:17px;height:17px;cursor:pointer;padding:0}.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.primary:hover:not(:disabled){background:#304691}.danger{color:#b43842;border-color:#edcfd2}nav{background:#fff;border-bottom:1px solid var(--line);padding:22px max(24px,calc((100vw - 1000px)/2));font-weight:750}nav span{font-size:13px;font-weight:400;color:var(--muted);margin-left:18px}main{max-width:1048px;padding:40px 24px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px}.heading h1{margin:0;font-size:28px;letter-spacing:-.03em}.heading p{margin:10px 0;color:var(--muted);font-size:14px;line-height:1.7}.badge{font-size:12px;color:var(--accent);background:#eaf0fe;border-radius:20px;padding:8px 12px;white-space:nowrap}.add{margin:26px 0 20px;padding:21px;background:#fff;border:1px solid var(--line);border-radius:12px}.add label{display:block;font-size:14px;font-weight:650;margin-bottom:12px}.addrow{display:flex;gap:10px}.addrow input{flex:1;min-width:0}.add p{font-size:12px;margin:9px 0 0;color:var(--muted)}.collection{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.tools{padding:18px;display:flex;gap:12px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}#search{width:310px;max-width:100%}.tools-right{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}.listhead,.row{display:grid;grid-template-columns:28px minmax(0,1fr) 140px;gap:12px;align-items:center;padding:17px 22px}.listhead{background:#fafbfe;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}.row{border-bottom:1px solid #edf0f5;min-height:73px}.row:last-child{border:0}.row.selected{background:#f2f5ff}.name{font-size:14px;overflow-wrap:anywhere;line-height:1.7;display:flex;gap:11px;align-items:center}.icon{display:grid;place-items:center;flex-shrink:0;width:31px;height:36px;border-radius:5px;color:var(--accent);background:#edf1fb;font-size:18px}.row time{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:52px 20px;color:var(--muted);font-size:14px;line-height:1.9}.empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:5px}.foot{padding:14px 22px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}.undo{margin-top:12px;padding:14px 18px;border:1px solid #cfdaf0;background:#edf3ff;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:13px;line-height:1.7}.undo button{min-height:35px;padding:6px 12px;color:var(--accent);white-space:nowrap}.notice{min-height:24px;color:var(--muted);font-size:13px;line-height:1.7;margin:14px 0}.notice.error{color:#a13536}.privacy{font-size:12px;color:var(--muted);line-height:1.9;margin-top:22px}@media(max-width:620px){nav{padding:20px 18px}main{padding:28px 16px}.heading{align-items:flex-start}.badge{display:none}.add{padding:18px}.tools{align-items:stretch;flex-direction:column}#search{width:100%}.tools-right{justify-content:space-between}.listhead,.row{grid-template-columns:24px minmax(0,1fr);padding:16px;gap:7px}.listhead span:last-child,.row time{display:none}.undo{padding:13px}.name{font-size:13px}}
</style></head><body>
<nav>▤ 课架<span>我的学习资料</span></nav><main><div class="heading"><div><h1>课程资料</h1><p>把资料归到一处，让下一次查找更轻松。</p></div><span class="badge">保存在当前浏览器</span></div>
<form id="add-form" class="add"><label for="new-name">新增资料</label><div class="addrow"><input id="new-name" required maxlength="120" placeholder="输入资料名，如：第一课 · 设计基础" autocomplete="off"><button class="primary" type="submit">添加资料</button></div><p>记录资料名称，最多 120 个字符。</p></form>
<section class="collection" aria-label="课程资料列表"><div class="tools"><input id="search" type="search" aria-label="搜索资料名称" placeholder="搜索资料名称…"><div class="tools-right"><span id="selection-count">已选 0 项</span><button id="delete" class="danger" disabled>删除所选</button></div></div><div class="listhead"><input id="select-all" type="checkbox" aria-label="选择当前搜索结果中的全部资料"><span>资料名称</span><span>添加日期</span></div><div id="list"></div><div id="foot" class="foot">共 0 份资料</div></section>
<div id="undo-list" aria-label="可撤销的删除操作"></div><p id="notice" class="notice" role="status" aria-live="polite"></p><p class="privacy">资料仅保存在当前浏览器，不会同步到其他设备。删除后有 30 秒撤销时间，倒计时结束后无法恢复。清除浏览器数据会移除资料。</p>
</main><script>
'use strict';
const KEY='course-shelf-baseline-v1',list=document.getElementById('list'),undoList=document.getElementById('undo-list'),search=document.getElementById('search'),selectAll=document.getElementById('select-all'),deleteButton=document.getElementById('delete'),notice=document.getElementById('notice');let items=[],trash=[],selected=new Set(),storageAvailable=true;
function tell(message,error=false){notice.textContent=message;notice.classList.toggle('error',error)}
function id(){return typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,items,trash}));storageAvailable=true;return true}catch{storageAvailable=false;tell('浏览器无法保存资料。当前操作仅在本页有效，请检查存储权限后再试。',true);return false}}
function validItem(item){return item&&typeof item.id==='string'&&typeof item.name==='string'&&typeof item.created==='number'}
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(!data||data.version!==1||!Array.isArray(data.items)||!Array.isArray(data.trash))throw new Error('Invalid data');items=data.items.filter(validItem);trash=data.trash.filter(batch=>batch&&typeof batch.id==='string'&&typeof batch.deadline==='number'&&Array.isArray(batch.items)&&batch.items.every(validItem))}}catch{tell('无法读取已存资料。你仍可添加新资料；请检查浏览器存储设置。',true)}
function visibleItems(){const query=search.value.trim().toLocaleLowerCase();return items.filter(item=>item.name.toLocaleLowerCase().includes(query))}
function render(){const visible=visibleItems();list.replaceChildren();if(!visible.length){const empty=document.createElement('div');empty.className='empty';const strong=document.createElement('strong');strong.textContent=items.length?'没有找到匹配的资料':'添加你的第一份课程资料';const text=document.createElement('span');text.textContent=items.length?'换一个关键词，或清空搜索再查看。':'在上方输入资料名，开始整理你的课程。';empty.append(strong,text);list.append(empty)}else{visible.forEach(item=>{const row=document.createElement('div');row.className='row'+(selected.has(item.id)?' selected':'');const box=document.createElement('input');box.type='checkbox';box.checked=selected.has(item.id);box.setAttribute('aria-label','选择资料：'+item.name);box.addEventListener('change',()=>{box.checked?selected.add(item.id):selected.delete(item.id);render()});const name=document.createElement('span');name.className='name';const icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent='▤';const title=document.createElement('span');title.textContent=item.name;name.append(icon,title);const time=document.createElement('time');time.dateTime=new Date(item.created).toISOString();time.textContent=new Date(item.created).toLocaleDateString('zh-CN');row.append(box,name,time);list.append(row)})}const checked=visible.filter(item=>selected.has(item.id)).length;selectAll.disabled=!visible.length;selectAll.checked=visible.length>0&&checked===visible.length;selectAll.indeterminate=checked>0&&checked<visible.length;deleteButton.disabled=!selected.size;document.getElementById('selection-count').textContent='已选 '+selected.size+' 项';document.getElementById('foot').textContent=search.value.trim()?'找到 '+visible.length+' 份 · 共 '+items.length+' 份资料':'共 '+items.length+' 份资料';renderUndo()}
function renderUndo(){undoList.replaceChildren();trash.forEach(batch=>{const seconds=Math.max(0,Math.ceil((batch.deadline-Date.now())/1000));if(!seconds)return;const bar=document.createElement('div');bar.className='undo';const text=document.createElement('span');text.textContent='已删除 '+batch.items.length+' 份资料 · '+seconds+' 秒内可撤销';const button=document.createElement('button');button.textContent='撤销删除';button.setAttribute('aria-label','撤销删除 '+batch.items.length+' 份资料');button.addEventListener('click',()=>undo(batch.id));bar.append(text,button);undoList.append(bar)})}
function purge(){const now=Date.now(),expired=trash.filter(batch=>batch.deadline<=now);if(!expired.length)return false;trash=trash.filter(batch=>batch.deadline>now);save();if(storageAvailable)tell(expired.reduce((sum,batch)=>sum+batch.items.length,0)+' 份资料的撤销时间已结束，无法恢复。');return true}
function undo(batchId){const batch=trash.find(item=>item.id===batchId);if(!batch)return;if(batch.deadline<=Date.now()){purge();renderUndo();return}trash=trash.filter(item=>item.id!==batchId);items.push(...batch.items);items.sort((a,b)=>b.created-a.created);const saved=save();render();if(saved)tell('已恢复 '+batch.items.length+' 份资料。')}
document.getElementById('add-form').addEventListener('submit',event=>{event.preventDefault();const input=document.getElementById('new-name'),name=input.value.trim();if(!name){tell('请先输入资料名称。',true);input.focus();return}items.unshift({id:id(),name,created:Date.now()});const saved=save();input.value='';render();if(saved)tell('已添加并保存“'+name+'”。'+(search.value.trim()?'当前搜索可能隐藏这份资料。':''));input.focus()});
search.addEventListener('input',render);selectAll.addEventListener('change',()=>{visibleItems().forEach(item=>selectAll.checked?selected.add(item.id):selected.delete(item.id));render()});
deleteButton.addEventListener('click',()=>{const removed=items.filter(item=>selected.has(item.id));if(!removed.length)return;items=items.filter(item=>!selected.has(item.id));trash.push({id:id(),items:removed,deadline:Date.now()+30000});selected.clear();const saved=save();render();if(saved)tell('已删除 '+removed.length+' 份资料，30 秒内可以撤销。')});
purge();render();setInterval(()=>{purge();renderUndo()},1000);
</script></body></html>
