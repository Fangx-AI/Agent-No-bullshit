<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON 格式化 · 工具箱</title>
<style>
:root{color-scheme:light;--ink:#182432;--muted:#6c7784;--line:#dde3e9;--accent:#dc512f;--paper:#fff;--bg:#f4f5f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,select{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eeaa88;outline-offset:3px}.top{height:72px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-weight:750;letter-spacing:.02em;display:flex;align-items:center;gap:10px}.mark{background:var(--ink);color:#fff;border-radius:9px;padding:2px 10px;font:700 23px/1.4 monospace}.crumb{color:var(--muted);font-size:13px}main{max-width:1320px;margin:46px auto;padding:0 32px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:27px}h1{font-size:34px;line-height:1.2;letter-spacing:-1px;margin:0 0 10px}p{margin:0;color:var(--muted)}.pill{border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:#fff;font-size:12px;color:var(--muted)}.workspace{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 32px #172c4310}.toolbar{display:flex;align-items:center;gap:10px;padding:17px 22px;border-bottom:1px solid var(--line);background:#fcfcfd}.button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 16px;font-weight:600}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.plain{background:transparent;border-color:transparent;color:var(--muted)}.indent{margin-left:auto;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}select{border:1px solid var(--line);border-radius:6px;background:white;padding:7px;color:var(--ink)}.panes{display:grid;grid-template-columns:1fr 1fr}.pane+.pane{border-left:1px solid var(--line)}.pane-head{padding:17px 22px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}.count{color:var(--muted);font-size:12px;font-weight:400}textarea{display:block;resize:vertical;min-height:340px;height:440px;width:100%;border:0;background:#fff;color:var(--ink);padding:0 22px 22px;line-height:1.65;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;outline-offset:-4px!important}textarea[readonly]{background:#fafbfc}textarea::placeholder{color:#a2abb6}.pane.result{background:#fafbfc}.statusbar{border-top:1px solid var(--line);min-height:54px;display:flex;justify-content:space-between;align-items:center;padding:13px 22px;gap:20px;font-size:13px}.status{color:var(--muted);white-space:pre-wrap}.status.error{color:#af2f22}.status.success{color:#237048}.shortcut{color:#8993a0;white-space:nowrap;font-size:12px}kbd{background:#f0f2f5;border:1px solid #dce0e5;border-radius:4px;padding:1px 5px;font:inherit}.foot{display:flex;justify-content:space-between;padding:17px 3px;color:#939ca7;font-size:12px}@media(max-width:720px){.top{padding:0 20px}.crumb{display:none}main{margin:30px auto;padding:0 16px}h1{font-size:28px}.heading{align-items:flex-start}.pill{display:none}.toolbar{padding:14px;flex-wrap:wrap}.indent{margin-left:0}.panes{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}textarea{height:280px;min-height:240px}.shortcut{display:none}.statusbar{padding:13px 16px}.foot{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">{ }</span>工具箱</div><span class="crumb">开发工具 / JSON 格式化</span></header>
<main>
<div class="heading"><div><h1>JSON 格式化</h1><p>粘贴 JSON，让结构一目了然。</p></div><span class="pill">JSON → JSON</span></div>
<section class="workspace" aria-label="JSON 格式化工具">
<div class="toolbar"><button id="format" class="button primary">格式化</button><button id="copy" class="button" disabled>复制结果</button><button id="clear" class="button plain">清空</button><button id="example" class="button plain">填入示例</button><label class="indent">缩进<select id="indent"><option value="2">2 个空格</option><option value="4">4 个空格</option></select></label></div>
<div class="panes"><div class="pane"><div class="pane-head"><label for="input">原始 JSON</label><span class="count" id="inputCount">0 字符</span></div><textarea id="input" spellcheck="false" placeholder='{"name":"小林","courses":["设计","编程"],"active":true}' aria-describedby="status"></textarea></div><div class="pane result"><div class="pane-head"><label for="output">格式化结果</label><span class="count" id="outputCount">0 字符</span></div><textarea id="output" readonly spellcheck="false" placeholder="格式化结果会显示在这里"></textarea></div></div>
<div class="statusbar"><div id="status" class="status" role="status" aria-live="polite">等待输入</div><span class="shortcut"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 格式化</span></div>
</section>
<div class="foot"><span>保留数据结构，统一缩进。</span><span>工具箱 / 01</span></div>
</main>
<script>
/* CORE_START */
const Core = {
  format(raw, indent) {
    if (!raw.trim()) return {ok:false,error:'请先粘贴 JSON，或点击“填入示例”。',position:null};
    try { return {ok:true,text:JSON.stringify(JSON.parse(raw),null,Number(indent)===4?4:2)}; }
    catch(error) {
      const match = String(error.message).match(/position\s+(\d+)/i);
      const position = match ? Number(match[1]) : null;
      let location = '';
      if(position!==null) {
        const before = raw.slice(0,position).split('\n');
        location = '第 '+before.length+' 行，第 '+(before[before.length-1].length+1)+' 列附近有误。';
      }
      return {ok:false,error:location+'请检查双引号、逗号和括号，修改后再次格式化。',position};
    }
  }
};
/* CORE_END */
const input=document.getElementById('input'),output=document.getElementById('output'),formatButton=document.getElementById('format'),copyButton=document.getElementById('copy'),indent=document.getElementById('indent'),status=document.getElementById('status');
let revision=0,busy=false;
function setStatus(message,type=''){status.textContent=message;status.className='status '+type;}
function counts(){document.getElementById('inputCount').textContent=input.value.length.toLocaleString()+' 字符';document.getElementById('outputCount').textContent=output.value.length.toLocaleString()+' 字符';}
function setBusy(value){busy=value;formatButton.disabled=value;formatButton.textContent=value?'格式化中…':'格式化';}
function invalidate(){revision++;setBusy(false);output.value='';copyButton.disabled=true;counts();setStatus(input.value?'输入已更新，点击“格式化”。':'等待输入');}
input.addEventListener('input',invalidate);indent.addEventListener('change',invalidate);
function format(){
  const version=revision,raw=input.value,spacing=indent.value;
  setBusy(true);copyButton.disabled=true;output.value='';counts();setStatus('正在格式化…');
  setTimeout(()=>{
    if(version!==revision)return;
    const result=Core.format(raw,spacing);setBusy(false);
    if(result.ok){output.value=result.text;copyButton.disabled=false;setStatus('格式化完成','success');}
    else{setStatus(result.error,'error');input.focus();if(result.position!==null)input.setSelectionRange(result.position,Math.min(result.position+1,input.value.length));}
    counts();
  },30);
}
formatButton.addEventListener('click',format);
document.getElementById('clear').addEventListener('click',()=>{input.value='';invalidate();input.focus();});
document.getElementById('example').addEventListener('click',()=>{input.value='{"name":"小林","courses":["设计","编程"],"active":true}';invalidate();input.focus();});
input.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();if(!busy)format();}});
copyButton.addEventListener('click',async()=>{
  if(!output.value||copyButton.disabled)return;
  const text=output.value,version=revision;copyButton.disabled=true;
  let copied=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);copied=true;}}catch(error){}
  if(!copied&&version===revision){output.focus();output.select();try{copied=document.execCommand('copy');}catch(error){}}
  if(version!==revision)return;
  copyButton.disabled=false;setStatus(copied?'结果已复制':'复制未成功。结果已选中，请按 Ctrl/Cmd + C 复制。',copied?'success':'error');
});
counts();
</script>
</body>
</html>
