<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>课程资料</title>
  <style>
    :root{color-scheme:light;--ink:#222a34;--muted:#6b7480;--line:#e2e7ec;--blue:#245bce;--blue-soft:#edf3ff;--red:#b34040;--paper:#fff;--canvas:#f5f7fa}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);line-height:1.5}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible{outline:3px solid #89b2ff;outline-offset:3px}button{transition:background .15s,border-color .15s}button:hover:not(:disabled){filter:brightness(.97)}
    .masthead{height:76px;background:#fff;border-bottom:1px solid var(--line)}.masthead-inner{max-width:1080px;margin:auto;padding:0 28px;height:100%;display:flex;align-items:center;gap:11px}.brand-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff}.brand{font-size:17px;font-weight:700;letter-spacing:.02em}.brand-note{margin-left:auto;font-size:12px;color:var(--muted)}
    main{max-width:1080px;margin:44px auto;padding:0 28px 70px}.heading{display:flex;align-items:center;gap:14px;margin-bottom:25px}h1{font-size:30px;letter-spacing:-.04em;margin:0;font-weight:720}.count{font-size:12px;color:#4c5e73;border:1px solid #dce3eb;background:#edf1f6;border-radius:30px;padding:4px 11px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 30px #24385005}
    .add-section{padding:24px;margin-bottom:24px}.field-label{display:block;font-weight:650;font-size:14px;margin-bottom:10px}.add-row{display:flex;gap:12px}.add-input{min-width:0;flex:1;border:1px solid #ccd5df;background:#fff;border-radius:8px;padding:12px 14px;height:46px;font-size:14px}.add-input::placeholder,.search-input::placeholder{color:#919aa6}.primary{color:#fff;background:var(--blue);border:1px solid var(--blue);border-radius:8px;min-height:46px;padding:10px 22px;font-size:14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}.field-error{font-size:13px;color:var(--red);margin:8px 0 0}.field-error:empty{display:none}
    .library-toolbar{display:flex;gap:20px;align-items:center;padding:21px 24px;border-bottom:1px solid var(--line)}.search-wrap{display:flex;align-items:center;position:relative;width:360px;max-width:100%;color:#7e8996}.search-icon{position:absolute;left:12px;pointer-events:none}.search-input{width:100%;height:40px;background:#f8fafc;border:1px solid #dbe2e9;border-radius:8px;padding:9px 37px;font-size:13px}.clear-search{border:0;background:transparent;position:absolute;right:4px;height:30px;width:30px;border-radius:6px;color:#6b7480;font-size:20px}.match-count{font-size:12px;color:var(--muted);white-space:nowrap}.toolbar-spacer{flex:1}.sort-label{font-size:12px;color:var(--muted);white-space:nowrap}
    .selection-bar{display:flex;gap:15px;align-items:center;min-height:75px;padding:14px 24px;background:#fbfcfe;border-bottom:1px solid var(--line)}.select-all{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;white-space:nowrap}input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue);cursor:pointer;margin:0;flex:none}.selected-count{font-size:12px;color:var(--muted);margin-left:6px}.delete-section{margin-left:auto;display:flex;align-items:center;gap:14px}.delete-note{font-size:12px;color:#687480;max-width:290px}.delete-button{border:1px solid #e7c5c5;border-radius:7px;background:#fff;color:var(--red);padding:8px 13px;font-size:13px;font-weight:600;white-space:nowrap}
    .list-head{display:grid;grid-template-columns:38px 1fr 140px;align-items:center;padding:13px 24px;font-size:12px;color:#8a949f;border-bottom:1px solid var(--line)}.list-head span:last-child{text-align:right}.material-row{display:grid;grid-template-columns:38px 1fr 140px;align-items:center;gap:0;min-height:78px;padding:16px 24px;border-bottom:1px solid #eef1f4;cursor:pointer}.material-row:last-child{border-bottom:0}.material-row:hover{background:#fafcff}.material-row.is-selected{background:var(--blue-soft)}.material-title{display:flex;align-items:center;gap:13px;min-width:0;font-size:14px;font-weight:550}.file-icon{display:grid;place-items:center;border:1px solid #dbe4f1;border-radius:8px;background:#f3f7fc;color:#6a8cb9;width:35px;height:39px;flex:none}.material-name{overflow-wrap:anywhere}.added-time{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}.empty{padding:62px 24px 67px;text-align:center}.empty-icon{display:grid;place-items:center;width:65px;height:65px;background:#f0f4f9;color:#8495ab;border:1px solid #e5ebf3;border-radius:18px;margin:0 auto 16px}.empty h2{margin:0 0 6px;font-size:17px;font-weight:650}.empty p{margin:0;color:var(--muted);font-size:13px}
    .storage-status{display:flex;align-items:center;gap:7px;font-size:12px;color:#77818d;padding:15px 3px}.storage-status svg{color:#6f9a83}.storage-status.is-error{color:var(--red);background:#fff4f3;border:1px solid #f0d7d4;border-radius:9px;padding:12px 14px;margin-top:14px}.storage-status.is-error svg{color:var(--red)}.retry-button{border:1px solid #e2b6b6;border-radius:6px;background:#fff;color:var(--red);padding:5px 11px;margin-left:auto;white-space:nowrap}.notices{display:grid;gap:9px;margin-top:6px}.undo-card{display:flex;align-items:center;gap:12px;background:#eef4ff;border:1px solid #d9e5fc;border-radius:10px;padding:14px 17px;font-size:13px}.undo-card>svg{color:var(--blue);flex:none}.undo-card .notice-text{flex:1}.undo-card .timer{color:#596e91;display:block;font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}.undo-button{background:#fff;color:var(--blue);border:1px solid #cadbfa;border-radius:7px;padding:7px 14px;font-weight:600;font-size:13px}.expired-card{background:#fff;border-color:var(--line);color:var(--muted)}.expired-card>svg{color:#8390a1}.dismiss{border:0;background:transparent;color:#7a8796;padding:4px 7px;border-radius:5px;font-size:19px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}
    @media(max-width:760px){.masthead-inner{padding:0 20px}.brand-note{display:none}main{margin-top:28px;padding:0 16px 45px}h1{font-size:26px}.heading{margin-bottom:20px}.add-section{padding:20px}.primary{padding:10px 15px}.library-toolbar{padding:17px 18px;gap:12px}.sort-label{display:none}.search-wrap{width:100%}.selection-bar{padding:14px 18px;flex-wrap:wrap;gap:8px}.delete-section{width:100%;margin-left:0;border-top:1px solid #e8edf2;padding-top:12px;justify-content:space-between}.delete-note{max-width:none;font-size:11px}.list-head{padding:12px 18px;grid-template-columns:30px 1fr 95px}.material-row{padding:15px 18px;grid-template-columns:30px 1fr 95px}.material-title{gap:10px;font-size:13px}.added-time{font-size:11px}.file-icon{width:29px;height:34px}.empty{padding:50px 20px}.undo-card{padding:12px;gap:9px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="masthead"><div class="masthead-inner"><span class="brand-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5c3-1 5-1 8 1 3-2 5-2 8-1v14c-3-1-5-1-8 1-3-2-5-2-8-1z"/><path d="M12 6.5v14"/></svg></span><span class="brand">课程资料</span><span class="brand-note">学习资料管理</span></div></header>
  <main>
    <div class="heading"><h1>我的资料</h1><span class="count" id="total-count">0 份</span></div>
    <section class="panel add-section" aria-labelledby="add-label">
      <form id="add-form" novalidate><label class="field-label" id="add-label" for="material-input">新增资料</label><div class="add-row"><input id="material-input" class="add-input" maxlength="100" autocomplete="off" placeholder="输入资料名，例如：第 1 讲 · 课程讲义" aria-describedby="add-error"><button class="primary" id="add-button" type="submit"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>添加资料</button></div><p class="field-error" id="add-error" role="alert"></p></form>
    </section>
    <section class="panel" aria-label="资料列表">
      <div class="library-toolbar"><div class="search-wrap"><svg class="search-icon" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input class="search-input" id="search-input" type="search" placeholder="搜索资料名" aria-label="搜索资料名"><button class="clear-search" id="clear-search" aria-label="清除搜索" hidden>×</button></div><span class="match-count" id="match-count"></span><div class="toolbar-spacer"></div><span class="sort-label">最近添加在前</span></div>
      <div class="selection-bar"><label class="select-all"><input type="checkbox" id="select-all"><span id="select-all-label">全选资料</span></label><span class="selected-count" id="selected-count">未选择</span><div class="delete-section"><span class="delete-note">删除后可在 30 秒内撤销，超时无法恢复。</span><button class="delete-button" id="delete-button" disabled>批量删除</button></div></div>
      <div class="list-head" id="list-head"><span></span><span>资料名称</span><span>新增时间</span></div><div id="materials"></div>
    </section>
    <div class="storage-status" id="storage-status" role="status"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 10 3 3 7-7"/></svg><span id="storage-text">保存在当前浏览器</span><button class="retry-button" id="retry-button" hidden>重试</button></div>
    <div class="notices" id="notices" aria-label="删除与撤销结果"></div><div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
  </main>
  <script>
  'use strict';
  const STORAGE_KEY = 'course-materials-v1';
  const UNDO_MS = 30000;
  const emptyState = () => ({version:1,items:[],pending:[]});
  function validateState(value){
    if(!value || value.version!==1 || !Array.isArray(value.items) || !Array.isArray(value.pending)) throw new Error('invalid state');
    const ids=new Set();
    const validTime=time=>Number.isSafeInteger(time)&&time>=0&&time<=8640000000000000;
    const checkItem=item=>{if(!item || typeof item.id!=='string' || !item.id || ids.has(item.id) || typeof item.name!=='string' || !item.name.trim() || item.name.length>100 || !validTime(item.createdAt))throw new Error('invalid item');ids.add(item.id);};
    value.items.forEach(checkItem);
    const batches=new Set();
    value.pending.forEach(batch=>{if(!batch || typeof batch.id!=='string' || !batch.id || batches.has(batch.id) || !validTime(batch.expiresAt) || !Array.isArray(batch.items) || !batch.items.length)throw new Error('invalid batch');batches.add(batch.id);batch.items.forEach(checkItem);});
    return value;
  }
  function pruneExpired(value,now){return {state:{...value,pending:value.pending.filter(batch=>batch.expiresAt>now)},expired:value.pending.filter(batch=>batch.expiresAt<=now)};}
  function addToState(value,name,id,now){const trimmed=name.trim();if(!trimmed || trimmed.length>100)return null;return {...value,items:[{id,name:trimmed,createdAt:now},...value.items]};}
  function deleteFromState(value,selected,id,now){const items=value.items.filter(item=>selected.has(item.id));if(!items.length)return null;return {...value,items:value.items.filter(item=>!selected.has(item.id)),pending:[...value.pending,{id,items,expiresAt:now+UNDO_MS}]};}
  function restoreBatch(value,id,now){const batch=value.pending.find(item=>item.id===id);if(!batch || now>=batch.expiresAt)return null;return {...value,items:[...value.items,...batch.items].sort((a,b)=>b.createdAt-a.createdAt),pending:value.pending.filter(item=>item.id!==id)};}
  function filterItems(value,query){const term=query.trim().toLocaleLowerCase();return value.items.filter(item=>item.name.toLocaleLowerCase().includes(term));}
  // app-start
  const $=id=>document.getElementById(id);
  let state=emptyState();let selected=new Set();let blocked=false;let retryAction=null;let expiredNotice=null;let lastPendingSignature='';
  const fileSvg='<svg width="18" height="22" viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 2h8l5 5v17H5z"/><path d="M13 2v6h5M8 13h7M8 17h7"/></svg>';
  const clockSvg='<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M10 5.5v4.7l3 1.8"/></svg>';
  function makeId(){return typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
  function announce(message){$('announcer').textContent=message;}
  function storageError(message,retry){retryAction=retry;$('storage-status').classList.add('is-error');$('storage-text').textContent=message;$('retry-button').hidden=false;}
  function storageOk(){retryAction=null;$('storage-status').classList.remove('is-error');$('storage-text').textContent='保存在当前浏览器';$('retry-button').hidden=true;}
  function persist(next,retry){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));state=next;storageOk();return true;}catch(error){storageError('保存失败，刚才的操作未完成。检查浏览器存储设置后重试。',retry);return false;}}
  function readSaved(){
    try{const raw=localStorage.getItem(STORAGE_KEY);const loaded=raw===null?emptyState():validateState(JSON.parse(raw));const result=pruneExpired(loaded,Date.now());state=result.state;blocked=false;selected=new Set([...selected].filter(id=>state.items.some(item=>item.id===id)));storageOk();if(result.expired.length){expiredNotice={count:result.expired.reduce((sum,batch)=>sum+batch.items.length,0)};try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(error){/* The deadline still prevents restoration; clearing expired storage can be retried later. */}}render();}
    catch(error){blocked=true;storageError('浏览器中的资料未能读取，检查存储设置后重试。',readSaved);render();}
  }
  function render(){
    const focusedItem=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.materialId:null;
    const visible=filterItems(state,$('search-input').value);const query=$('search-input').value.trim();
    $('total-count').textContent=state.items.length+' 份';$('match-count').textContent=query?'找到 '+visible.length+' 份':'';$('clear-search').hidden=!$('search-input').value;$('select-all-label').textContent=query?'全选搜索结果':'全选资料';
    $('add-button').disabled=blocked;$('material-input').disabled=blocked;$('select-all').disabled=blocked||!visible.length;
    const visibleSelected=visible.filter(item=>selected.has(item.id)).length;$('select-all').checked=visible.length>0&&visibleSelected===visible.length;$('select-all').indeterminate=visibleSelected>0&&visibleSelected<visible.length;
    $('selected-count').textContent=selected.size?'已选 '+selected.size+' 项':'未选择';$('delete-button').disabled=blocked||!selected.size;$('delete-button').textContent=selected.size?'删除 '+selected.size+' 项':'批量删除';
    const holder=$('materials');holder.replaceChildren();$('list-head').hidden=!visible.length;
    if(!visible.length){const empty=document.createElement('div');empty.className='empty';const icon=document.createElement('div');icon.className='empty-icon';icon.innerHTML=query?'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg>':fileSvg;const title=document.createElement('h2');title.textContent=blocked?'资料暂时无法读取':query?'没有匹配的资料':'还没有资料';const hint=document.createElement('p');hint.textContent=blocked?'点击下方“重试”重新读取。':query?'换个关键词，或清除搜索。':'在上方添加第一个资料名。';empty.append(icon,title,hint);holder.append(empty);}
    visible.forEach(item=>{const row=document.createElement('label');row.className='material-row'+(selected.has(item.id)?' is-selected':'');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.dataset.materialId=item.id;checkbox.checked=selected.has(item.id);checkbox.disabled=blocked;checkbox.setAttribute('aria-label','选择 '+item.name);checkbox.addEventListener('change',()=>{checkbox.checked?selected.add(item.id):selected.delete(item.id);render();});const title=document.createElement('span');title.className='material-title';const icon=document.createElement('span');icon.className='file-icon';icon.innerHTML=fileSvg;const name=document.createElement('span');name.className='material-name';name.textContent=item.name;title.append(icon,name);const time=document.createElement('span');time.className='added-time';time.textContent=new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(item.createdAt));row.append(checkbox,title,time);holder.append(row);});
    if(focusedItem){const checkbox=[...holder.querySelectorAll('input')].find(input=>input.dataset.materialId===focusedItem);if(checkbox)checkbox.focus();}
    renderNotices(true);
  }
  function renderNotices(force=false){
    const focusedBatch=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.batchId:null;
    const now=Date.now();const signature=JSON.stringify([state.pending.map(batch=>[batch.id,Math.max(0,Math.ceil((batch.expiresAt-now)/1000))]),expiredNotice,blocked]);if(!force&&signature===lastPendingSignature)return;lastPendingSignature=signature;
    const holder=$('notices');holder.replaceChildren();
    state.pending.filter(batch=>batch.expiresAt>now).forEach(batch=>{const card=document.createElement('div');card.className='undo-card';card.innerHTML=clockSvg;const text=document.createElement('span');text.className='notice-text';text.textContent='已删除 '+batch.items.length+' 份资料';const timer=document.createElement('span');timer.className='timer';timer.textContent=Math.ceil((batch.expiresAt-now)/1000)+' 秒内可撤销';text.append(timer);const button=document.createElement('button');button.className='undo-button';button.dataset.batchId=batch.id;button.textContent='撤销';button.disabled=blocked;button.setAttribute('aria-label','撤销删除 '+batch.items.length+' 份资料');button.addEventListener('click',()=>undo(batch.id));card.append(text,button);holder.append(card);});
    if(expiredNotice){const card=document.createElement('div');card.className='undo-card expired-card';card.innerHTML=clockSvg;const text=document.createElement('span');text.className='notice-text';text.textContent=expiredNotice.count+' 份资料的撤销时间已过，无法恢复。';const close=document.createElement('button');close.className='dismiss';close.textContent='×';close.setAttribute('aria-label','关闭到期提示');close.addEventListener('click',()=>{expiredNotice=null;renderNotices(true);});card.append(text,close);holder.append(card);}
    if(focusedBatch){const button=[...holder.querySelectorAll('button')].find(item=>item.dataset.batchId===focusedBatch);if(button)button.focus();}
  }
  function add(){
    if(blocked)return;const name=$('material-input').value;const next=addToState(state,name,makeId(),Date.now());if(!next){$('add-error').textContent=name.trim()?'资料名最多 100 个字符，请缩短后再添加。':'请输入资料名，再添加。';$('material-input').setAttribute('aria-invalid','true');$('material-input').focus();return;}
    if(persist(next,add)){$('material-input').value='';$('add-error').textContent='';$('material-input').removeAttribute('aria-invalid');$('search-input').value='';selected.clear();render();announce('已添加资料 '+name.trim());$('material-input').focus();}
  }
  function deleteSelected(){if(blocked)return;const next=deleteFromState(state,selected,makeId(),Date.now());if(!next)return;const count=selected.size;if(persist(next,deleteSelected)){selected.clear();expiredNotice=null;render();announce('已删除 '+count+' 份资料，30 秒内可撤销。');}}
  function undo(id){if(blocked)return;const batch=state.pending.find(item=>item.id===id);const next=restoreBatch(state,id,Date.now());if(!next){expire();return;}if(persist(next,()=>undo(id))){render();announce('已恢复 '+batch.items.length+' 份资料。');}}
  function expire(){
    if(blocked){renderNotices();return;}
    const result=pruneExpired(state,Date.now());if(result.expired.length){state=result.state;expiredNotice={count:result.expired.reduce((sum,batch)=>sum+batch.items.length,0)};try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(error){/* Expired batches cannot be restored even if browser storage is temporarily unavailable. */}render();announce(expiredNotice.count+' 份资料的撤销时间已过，无法恢复。');}else renderNotices();
  }
  $('add-form').addEventListener('submit',event=>{event.preventDefault();add();});$('material-input').addEventListener('input',()=>{$('add-error').textContent='';$('material-input').removeAttribute('aria-invalid');});
  $('search-input').addEventListener('input',()=>{selected.clear();render();});$('clear-search').addEventListener('click',()=>{$('search-input').value='';selected.clear();render();$('search-input').focus();});
  $('select-all').addEventListener('change',()=>{filterItems(state,$('search-input').value).forEach(item=>$('select-all').checked?selected.add(item.id):selected.delete(item.id));render();});$('delete-button').addEventListener('click',deleteSelected);$('retry-button').addEventListener('click',()=>{if(retryAction)retryAction();});
  window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY||event.key===null)readSaved();});document.addEventListener('visibilitychange',()=>{if(!document.hidden)expire();});
  readSaved();setInterval(expire,250);
  </script>
</body>
</html>
