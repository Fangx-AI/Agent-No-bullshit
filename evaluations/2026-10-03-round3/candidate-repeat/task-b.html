<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>留一段声音 · 播客预约</title>
  <style>
    :root{color-scheme:light;--ink:#282622;--muted:#7b756b;--line:#e2dcd2;--brand:#a34528;--cream:#f6f1e7;--red:#ab3030}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}input:focus-visible,button:focus-visible{outline:3px solid #c59066;outline-offset:3px}input{min-width:0}.shell{max-width:1130px;margin:auto;padding:32px 32px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding-bottom:24px;border-bottom:1px solid #d9d1c3}.brand{font-weight:750;display:flex;align-items:center;gap:9px}.brand-symbol{height:28px;width:28px;background:var(--brand);color:white;display:grid;place-items:center;border-radius:50%;font-size:17px}.badge{font-size:12px;padding:3px 10px;border:1px solid #d5c4ad;border-radius:100px;color:#80684e}.layout{display:grid;grid-template-columns:.85fr 1.2fr;gap:64px;margin-top:48px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--brand);font-weight:750}h1{font-size:clamp(36px,5vw,55px);letter-spacing:-.055em;line-height:1.22;margin:17px 0 21px}.lead{max-width:300px;color:var(--muted);font-size:16px;margin:0}.cover{position:relative;background:#333f35;height:237px;border-radius:14px;margin-top:37px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#e4bc7b}.cover:before{content:"";position:absolute;inset:20px;border:1px solid #b5beac2b;border-radius:50%}.cover:after{content:"";width:150px;height:150px;position:absolute;border:1px solid #c2ba8940;border-radius:50%}.wave{display:flex;gap:7px;align-items:center;z-index:1}.wave i{width:5px;border-radius:8px;background:#e4bc7b;display:block}.wave i:nth-child(1),.wave i:nth-child(9){height:20px}.wave i:nth-child(2),.wave i:nth-child(8){height:44px}.wave i:nth-child(3),.wave i:nth-child(7){height:70px}.wave i:nth-child(4),.wave i:nth-child(6){height:106px}.wave i:nth-child(5){height:132px}.cover-caption{position:absolute;left:22px;bottom:15px;letter-spacing:.13em;font-size:10px;color:#f1d5a4}.details{display:flex;gap:27px;color:var(--muted);font-size:13px;margin-top:20px}.details strong{font-size:15px;color:var(--ink);font-weight:600;display:block}.card{background:#fffefa;border:1px solid #e5ded3;border-radius:18px;padding:29px 32px;box-shadow:0 18px 45px #57432908}h2{margin:0 0 23px;font-size:23px;letter-spacing:-.025em}.field{margin-bottom:22px}.field>label,.field legend{font-size:14px;font-weight:650;margin-bottom:8px;display:block}.field input[type=date],.field input[type=text],.field input[type=email]{width:100%;background:white;border:1px solid #d8d2c8;border-radius:9px;padding:11px 13px;color:var(--ink)}.field input:disabled{background:#f4f1ea;color:#8a8377}fieldset.field{border:0;padding:0;min-width:0}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{position:relative;display:block}.slot input{position:absolute;opacity:0;width:1px;height:1px}.slot span{display:block;text-align:center;padding:9px 3px;background:#fff;border:1px solid #ddd6ca;border-radius:9px;font-size:14px}.slot input:checked+span{border-color:var(--brand);background:#faece3;color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);font-weight:700}.slot input:focus-visible+span{outline:3px solid #c59066;outline-offset:3px}.slot input:disabled+span{opacity:.5}.slot-empty{color:var(--muted);font-size:14px;padding:10px 0;margin:0}.time-caption{font-size:12px;color:var(--muted);margin-top:8px}.two-fields{display:grid;grid-template-columns:.85fr 1.15fr;gap:13px}.submit{width:100%;border:0;background:var(--brand);color:white;padding:13px 15px;border-radius:9px;font-weight:650;font-size:15px}.status{margin:12px 0 0;min-height:22px;font-size:13px;color:var(--muted)}.status.error{color:var(--red)}.preview{margin-top:20px;padding:19px;border:1px solid #ccdacf;background:#f1f7ef;border-radius:11px}.preview[hidden]{display:none}.preview h3{margin:0 0 12px;font-size:16px;color:#35543c}.preview dl{display:grid;grid-template-columns:60px 1fr;gap:6px 12px;font-size:14px;margin:0}.preview dt{color:#748071}.preview dd{margin:0;overflow-wrap:anywhere}.edit{border:0;background:transparent;color:#35543c;font:650 13px system-ui;margin-top:15px;padding:0;text-decoration:underline;text-underline-offset:4px}.footer{margin-top:35px;color:#8f887c;font-size:11px;letter-spacing:.1em}@media(max-width:850px){.layout{gap:30px;grid-template-columns:.8fr 1.2fr}.card{padding:24px}.shell{padding:24px}.cover{height:210px}}@media(max-width:640px){.shell{padding:22px 17px}.layout{grid-template-columns:1fr;margin-top:27px;gap:28px}h1{font-size:37px;margin-bottom:15px}.lead{max-width:none}.cover{display:none}.details{margin-top:19px}.card{padding:23px 20px}.two-fields{grid-template-columns:1fr;gap:0}.slots{grid-template-columns:repeat(3,1fr)}.footer{margin-top:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top" aria-label="页面标识"><div class="brand"><span class="brand-symbol" aria-hidden="true">◖</span>留一段声音</div><span class="badge">演示预约</span></nav>
    <div class="layout">
      <section>
        <div class="eyebrow">A CONVERSATION WORTH KEEPING</div>
        <h1>聊一聊，<br>你的故事。</h1>
        <p class="lead">选一个合适的时间，和我们录制一段播客对话。</p>
        <div class="cover" aria-hidden="true"><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="cover-caption">LEAVE A LITTLE SOUND / 01</div></div>
        <div class="details"><span><strong>45 分钟</strong>每场录制</span><span><strong>北京时间</strong>所有时段</span></div>
      </section>
      <section class="card">
        <h2>选择你的录制时间</h2>
        <form id="booking" novalidate>
          <div class="field"><label for="date">录制日期</label><input id="date" name="date" type="date" required aria-describedby="status"></div>
          <fieldset class="field"><legend>可选时段</legend><div id="slots" class="slots"></div><p class="slot-empty" id="slot-empty" hidden></p></fieldset>
          <div class="two-fields">
            <div class="field"><label for="name">姓名</label><input id="name" name="name" type="text" autocomplete="name" placeholder="怎么称呼你" maxlength="80" required></div>
            <div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
          </div>
          <button class="submit" id="submit" type="submit">提交预约</button>
          <p id="status" class="status" role="status" aria-live="polite">提交后生成预约预览。</p>
        </form>
        <section class="preview" id="preview" hidden tabindex="-1" aria-label="预约预览">
          <h3>预约预览已生成</h3>
          <dl><dt>日期</dt><dd id="preview-date"></dd><dt>时段</dt><dd id="preview-slot"></dd><dt>姓名</dt><dd id="preview-name"></dd><dt>邮箱</dt><dd id="preview-email"></dd></dl>
          <button class="edit" id="edit" type="button">修改信息</button>
        </section>
      </section>
    </div>
    <footer class="footer">留一段声音 · PODCAST STUDIO</footer>
  </main>
  <script>
    function beijingToday() {
      const parts = new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
      const get = type => parts.find(part => part.type === type).value;
      return get('year') + '-' + get('month') + '-' + get('day');
    }
    function shiftDate(iso, days) {
      const date = new Date(iso + 'T12:00:00Z');
      date.setUTCDate(date.getUTCDate() + days);
      return date.toISOString().slice(0,10);
    }
    function getAvailability(iso, minimum, maximum) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return {valid:false,slots:[]};
      const date = new Date(iso + 'T12:00:00Z');
      if (!Number.isFinite(date.getTime()) || date.toISOString().slice(0,10) !== iso || iso < minimum || iso > maximum) return {valid:false,slots:[]};
      const day = date.getUTCDay();
      if (day === 0) return {valid:true,slots:[]};
      const sets = [['10:00','11:00','14:00','15:00','16:00'],['09:00','10:00','14:00','16:00'],['10:00','13:00','15:00']];
      return {valid:true,slots:day === 6 ? ['10:00','11:00'] : sets[date.getUTCDate() % sets.length]};
    }
    function slotEnd(slot) {
      const pieces = slot.split(':').map(Number);
      const minutes = pieces[0] * 60 + pieces[1] + 45;
      return String(Math.floor(minutes / 60)).padStart(2,'0') + ':' + String(minutes % 60).padStart(2,'0');
    }
    // 界面逻辑
    const form = document.getElementById('booking');
    const dateInput = document.getElementById('date');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const slots = document.getElementById('slots');
    const slotEmpty = document.getElementById('slot-empty');
    const submit = document.getElementById('submit');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    let busy = false;
    const minimum = shiftDate(beijingToday(),1);
    const maximum = shiftDate(minimum,27);
    dateInput.min = minimum;
    dateInput.max = maximum;
    dateInput.value = minimum;
    if (!getAvailability(minimum,minimum,maximum).slots.length) dateInput.value = shiftDate(minimum,1);
    function announce(message, error) {status.textContent = message; status.className = 'status' + (error ? ' error' : '');}
    function invalidatePreview() {
      if (!preview.hidden) {preview.hidden = true; announce('信息已修改，重新提交即可更新预览。');}
      else if (!busy) announce('提交后生成预约预览。');
    }
    function renderSlots() {
      const availability = getAvailability(dateInput.value,minimum,maximum);
      slots.replaceChildren();
      slotEmpty.hidden = availability.slots.length > 0;
      if (!availability.valid) slotEmpty.textContent = '请选择 ' + minimum + ' 至 ' + maximum + ' 之间的日期。';
      else if (!availability.slots.length) slotEmpty.textContent = '当天没有可选时段，请换一个日期。';
      availability.slots.forEach(slot => {
        const label = document.createElement('label'); label.className = 'slot';
        const radio = document.createElement('input'); radio.type = 'radio'; radio.name = 'slot'; radio.value = slot; radio.required = true;
        const text = document.createElement('span'); text.textContent = slot;
        label.append(radio,text); slots.append(label);
      });
      submit.disabled = availability.slots.length === 0;
    }
    dateInput.addEventListener('change', () => {invalidatePreview(); renderSlots();});
    form.addEventListener('input', invalidatePreview);
    form.addEventListener('change', event => {if (event.target.name !== 'date') invalidatePreview();});
    document.getElementById('edit').addEventListener('click', () => {preview.hidden = true; announce('修改后重新提交即可更新预览。'); dateInput.focus();});
    form.addEventListener('submit', event => {
      event.preventDefault();
      if (busy) return;
      nameInput.value = nameInput.value.trim(); emailInput.value = emailInput.value.trim();
      const availability = getAvailability(dateInput.value,minimum,maximum);
      const checked = form.querySelector('input[name="slot"]:checked');
      if (!availability.valid || !availability.slots.length) {announce('请换一个有可选时段的日期。',true); dateInput.focus(); return;}
      if (!checked || !availability.slots.includes(checked.value)) {announce('先选择一个录制时段。',true); const first = slots.querySelector('input'); if (first) first.focus(); return;}
      if (!nameInput.value) {announce('请填写姓名后再提交。',true); nameInput.focus(); return;}
      if (!emailInput.validity.valid) {announce('请填写有效邮箱，例如 you@example.com。',true); emailInput.focus(); return;}
      const data = {date:dateInput.value,slot:checked.value,name:nameInput.value,email:emailInput.value};
      busy = true; preview.hidden = true;
      Array.from(form.elements).forEach(element => {element.disabled = true;});
      submit.textContent = '生成预览中…'; announce('');
      setTimeout(() => {
        document.getElementById('preview-date').textContent = data.date.replaceAll('-',' / ');
        document.getElementById('preview-slot').textContent = data.slot + ' — ' + slotEnd(data.slot) + '（北京时间）';
        document.getElementById('preview-name').textContent = data.name;
        document.getElementById('preview-email').textContent = data.email;
        Array.from(form.elements).forEach(element => {element.disabled = false;});
        busy = false; submit.textContent = '提交预约';
        preview.hidden = false; announce(''); preview.focus();
      },450);
    });
    renderSlots();
  </script>
</body>
</html>
