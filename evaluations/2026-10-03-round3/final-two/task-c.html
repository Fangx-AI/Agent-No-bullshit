adius:6px;padding:5px 10px;font-size:12px}.undo-stack{margin-top:17px;display:grid;gap:9px}.undo-card{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#e9edf2;border:1px solid #d7dfe9;border-radius:11px;padding:13px 16px}.undo-info{display:flex;gap:10px;align-items:center;min-width:0;font-size:13px;color:#4d5972}.undo-info svg{flex-shrink:0;color:#738397}.undo-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}.timer{font-size:12px;color:#7c8598;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}.undo{padding:5px 11px;border-radius:7px;border:1px solid #b4bfd0;background:#fafdff;color:#465b7e;font-weight:650;font-size:12px}.undo:hover{background:white}.status{min-height:22px;margin:14px 3px 0;font-size:12px;color:#6e788e}.footer{display:flex;justify-content:space-between;gap:15px;margin-top:21px;font-size:11px;letter-spacing:.7px;color:#9a9faf}@media(max-width:830px){.workspace{grid-template-columns:1fr;gap:23px}.sidebar{display:none}.app{max-width:770px;padding:25px 25px 40px}.head{margin-bottom:20px}}@media(max-width:520px){.app{padding:21px 16px 35px}.top{padding-bottom:19px}.local-tag{font-size:11px}.workspace{margin-top:26px}h1{font-size:28px}.big-icon{width:48px;height:48px;border-radius:13px}.add-area,.toolbar{padding:20px 17px}.add-row{gap:8px}.primary{padding:10px 13px}.batch-area{padding:0 17px 13px}.batch-actions{align-items:start}.selection{flex-direction:column;align-items:start;gap:5px}.selection-count{padding-left:25px}.delete-note{line-height:1.8}.row{padding:15px 17px;gap:10px}.row-number{display:none}.toolbar{gap:9px}.result-count{font-size:11px}.undo-card{padding:12px}.undo-info{gap:7px;font-size:12px}.undo-actions{gap:7px}.head p{font-size:12px}.error-banner{font-size:12px}}@media(prefers-reduced-motion:no-preference){button,.row{transition:background .15s}}

<body>
<div class="app">
  <header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span>课间</div><span class="local-tag">保存在当前浏览器</span></header>
  <div class="workspace">
    <aside class="sidebar"><p class="nav-label">我的空间</p><div class="nav-item" aria-current="page"><span class="nav-title"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 7h7l2-3h9v16H3z"/></svg>全部资料</span><span class="nav-count" id="nav-count">0</span></div></aside>
    <main>
      <div class="head"><div><div class="eyebrow">YOUR LEARNING LIBRARY</div><h1>课程资料</h1><p>新增资料名，搜索后批量整理。</p></div><span class="big-icon" aria-hidden="true"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4h6v16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm8 0h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6z"/><path d="M6 8h3M6 11h3m7-3h2m-2 3h2"/></svg></span></div>
      <div class="error-banner" id="storage-error" role="alert" hidden><span id="storage-error-text"></span><button type="button" class="retry" id="retry">重新读取</button></div>
      <section class="panel" aria-label="资料管理">
        <form class="add-area" id="add-form" novalidate><label class="add-label" for="material-name">新增资料</label><div class="add-row"><input id="material-name" name="material-name" placeholder="输入资料名，例如：第一课讲义" maxlength="120" required autocomplete="off" aria-describedby="add-error"><button class="primary" type="submit" id="add">＋ 添加</button></div><p class="field-error" id="add-error" hidden></p></form>
        <div class="toolbar"><div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input type="search" id="search" placeholder="搜索资料名" aria-label="搜索资料名"></div><span class="result-count" id="result-count">共 0 条资料</span></div>
        <div class="batch-area"><div class="batch-actions"><div class="selection"><label for="select-all"><input type="checkbox" id="select-all"><span id="select-all-label">全选</span></label><span class="selection-count" id="selection-count" hidden></span></div><button class="delete" type="button" id="delete" disabled>删除所选</button></div><p class="delete-note">删除后可在 30 秒内撤销；超时无法恢复。</p></div>
        <ul class="list" id="list" aria-label="课程资料列表"></ul>
        <div class="empty" id="empty"><div class="empty-icon" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8M8 16h5"/></svg></div><h2 id="empty-title">还没有资料</h2><p id="empty-text">输入资料名，添加第一份资料。</p></div>
      </section>
      <div class="undo-stack" id="undo-stack" aria-label="可撤销的删除"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <footer class="footer"><span>课间 · 课程资料</span><span id="saved-state"></span></footer>
    </main>
  </div>
</div>
<script id="material-core">
'use strict';
globalThis.MaterialCore = (() => {
  const empty=()=>({version:1,nextOrder:0,items:[],pending:[]});
  const validItem=item=>item && typeof item.id==='string' && item.id.length>0 && typeof item.name==='string' && item.name.trim().length>0 && item.name.length<=120 && Number.isFinite(item.createdAt) && Number.isFinite(new Date(item.createdAt).getTime()) && Number.isSafeInteger(item.order) && item.order>=0;
  function read(raw) {
    if(raw===null)return empty();
    const data=JSON.parse(raw);
    if(!data || data.version!==1 || !Number.isSafeInteger(data.nextOrder) || data.nextOrder<0 || !Array.isArray(data.items) || !Array.isArray(data.pending) || !data.items.every(validItem) || !data.pending.every(batch=>batch && typeof batch.id==='string' && batch.id.length>0 && Number.isFinite(batch.expiresAt) && Array.isArray(batch.items) && batch.items.length>0 && batch.items.every(validItem)))throw new Error('invalid-data');
    const all=[...data.items,...data.pending.flatMap(batch=>batch.items)], ids=new Set(all.map(item=>item.id)), orders=new Set(all.map(item=>item.order));
    if(ids.size!==all.length || orders.size!==all.length || all.some(item=>item.order>=data.nextOrder) || new Set(data.pending.map(batch=>batch.id)).size!==data.pending.length)throw new Error('invalid-data');
    return {...data,items:[...data.items].sort((a,b)=>a.order-b.order)};
  }
  function add(state,name,now,id) {
    const value=name.trim();if(!value || value.length>120)throw new Error('invalid-name');
    const item={id,name:value,createdAt:now,order:state.nextOrder};
    return {...state,nextOrder:state.nextOrder+1,items:[...state.items,item]};
  }
  function remove(state,ids,now,batchId) {
    const chosen=new Set(ids), removed=state.items.filter(item=>chosen.has(item.id));
    if(!removed.length)return {state,count:0};
    return {state:{...state,items:state.items.filter(item=>!chosen.has(item.id)),pending:[...state.pending,{id:batchId,items:removed,expiresAt:now+30000}]},count:removed.length};
  }
  function undo(state,batchId,now) {
    const batch=state.pending.find(value=>value.id===batchId);
    if(!batch)return {state,count:0,error:'missing'};
    if(now>=batch.expiresAt)return {state,count:0,error:'expired'};
    const existing=new Set(state.items.map(item=>item.id)), restored=batch.items.filter(item=>!existing.has(item.id));
    return {state:{...state,items:[...state.items,...restored].sort((a,b)=>a.order-b.order),pending:state.pending.filter(value=>value.id!==batchId)},count:restored.length};
  }
  function expire(state,now) {const ended=state.pending.filter(batch=>now>=batch.expiresAt);return {state:{...state,pending:state.pending.filter(batch=>now<batch.expiresAt)},count:ended.reduce((sum,batch)=>sum+batch.items.length,0)};}
  function search(items,query) {const value=query.trim().toLocaleLowerCase('zh-CN');return value?items.filter(item=>item.name.toLocaleLowerCase('zh-CN').includes(value)):items;}
  return {empty,read,add,remove,undo,expire,search};
})();
</script>
<script>
'use strict';
(() => {
  const core=MaterialCore,KEY='kejian-material-library-v1',$=id=>document.getElementById(id);
  let state=core.empty(),selected=new Set(),readBlocked=false,expiryRetry=false,expiredReported=new Set();
  const uid=()=>globalThis.crypto?.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const documentIcon='<svg width="18" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8M8 16h5"/></svg>';
  function status(message){$('status').textContent=message;}
  function failure(message,blocked=false){readBlocked=blocked;$('storage-error-text').textContent=message;$('storage-error').hidden=false;$('saved-state').textContent='保存未完成';updateControls();}
  function clearFailure(){$('storage-error').hidden=true;readBlocked=false;$('saved-state').textContent='已保存';}
  function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;expiryRetry=false;clearFailure();return true;}catch(_){failure('未能保存到当前浏览器。请检查浏览器存储设置后，再次执行操作。');return false;}}
  function readLatest(){try{const raw=localStorage.getItem(KEY);state=core.read(raw);clearFailure();if(raw===null)$('saved-state').textContent='';selected=new Set([...selected].filter(id=>state.items.some(item=>item.id===id)));return true;}catch(error){failure(error.message==='invalid-data'||error instanceof SyntaxError?'保存的数据无法读取，请检查浏览器中的课程资料数据后重试。':'无法读取当前浏览器的资料。请检查浏览器存储设置后重试。',true);return false;}}
  function visible(){return core.search(state.items,$('search').value);}
  function updateControls(){const items=visible(),visibleIds=new Set(items.map(item=>item.id));const chosen=items.filter(item=>selected.has(item.id)).length;$('select-all').checked=items.length>0&&chosen===items.length;$('select-all').indeterminate=chosen>0&&chosen<items.length;$('select-all').disabled=readBlocked||!items.length;$('select-all-label').textContent=$('search').value.trim()?'全选搜索结果':'全选';$('delete').disabled=readBlocked||!selected.size;$('delete').textContent=selected.size?`删除所选 (${selected.size})`:'删除所选';$('add').disabled=readBlocked;const hidden=[...selected].filter(id=>!visibleIds.has(id)).length;$('selection-count').hidden=!selected.size;$('selection-count').textContent=`已选 ${selected.size} 条${hidden?`，其中 ${hidden} 条不在搜索结果中`:''}`;}
  function renderList(){
    const items=readBlocked?[]:visible();$('nav-count').textContent=readBlocked?'—':state.items.length;$('result-count').textContent=readBlocked?'读取未完成':$('search').value.trim()?`找到 ${items.length} / ${state.items.length} 条`:`共 ${state.items.length} 条资料`;
    $('list').replaceChildren();
    for(const item of items){const row=document.createElement('li');row.className=`row${selected.has(item.id)?' selected':''}`;const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.id=`select-${item.id}`;checkbox.checked=selected.has(item.id);checkbox.disabled=readBlocked;const icon=document.createElement('span');icon.className='file-icon';icon.innerHTML=documentIcon;const info=document.createElement('div');info.className='file-info';const label=document.createElement('label');label.className='file-name';label.htmlFor=checkbox.id;label.textContent=item.name;const meta=document.createElement('div');meta.className='file-meta';meta.textContent=`添加于 ${new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date(item.createdAt))}`;info.append(label,meta);const number=document.createElement('span');number.className='row-number';number.textContent=String(item.order+1).padStart(2,'0');row.append(checkbox,icon,info,number);checkbox.addEventListener('change',()=>{if(checkbox.checked)selected.add(item.id);else selected.delete(item.id);row.classList.toggle('selected',checkbox.checked);updateControls();});$('list').append(row);}
    $('empty').hidden=items.length>0;$('empty-title').textContent=readBlocked?'资料暂时无法读取':$('search').value.trim()?'没有找到相关资料':'还没有资料';$('empty-text').textContent=readBlocked?'检查浏览器存储后，点击重新读取。':$('search').value.trim()?'换个关键词，或清空搜索。':'输入资料名，添加第一份资料。';updateControls();if(readBlocked)$('selection-count').hidden=true;
  }
  function renderUndo(){
    $('undo-stack').replaceChildren();const now=Date.now();
    for(const batch of state.pending){const card=document.createElement('div');card.className='undo-card';card.dataset.batch=batch.id;const info=document.createElement('div');info.className='undo-info';info.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 9M3 3v7h7"/></svg>';const text=document.createElement('span');text.textContent=`已删除 ${batch.items.length} 条资料`;info.append(text);const actions=document.createElement('div');actions.className='undo-actions';const timer=document.createElement('span');timer.className='timer';timer.setAttribute('aria-hidden','true');timer.textContent=`${Math.max(0,Math.ceil((batch.expiresAt-now)/1000))}s`;const undo=document.createElement('button');undo.type='button';undo.className='undo';undo.textContent=now>=batch.expiresAt?'已到期':'撤销';undo.disabled=readBlocked||now>=batch.expiresAt;undo.setAttribute('aria-label',`撤销删除的 ${batch.items.length} 条资料`);undo.addEventListener('click',()=>undoBatch(batch.id));actions.append(timer,undo);card.append(info,actions);$('undo-stack').append(card);}
  }
  function render(){renderList();renderUndo();}
  function expireNow(){
    const now=Date.now(),result=core.expire(state,now);
    if(!result.count)return;
    const fresh=state.pending.filter(batch=>now>=batch.expiresAt&&!expiredReported.has(batch.id));fresh.forEach(batch=>expiredReported.add(batch.id));
    const count=fresh.reduce((sum,batch)=>sum+batch.items.length,0);
    if(count)status(`${count} 条资料的撤销时间已结束，无法恢复。`);
    if(commit(result.state)){expiryRetry=false;renderUndo();}else{expiryRetry=true;renderUndo();}
  }
  function undoBatch(id){
    if(!readLatest()){render();return;}const result=core.undo(state,id,Date.now());
    if(result.error){status(result.error==='expired'?'这批资料的撤销时间已结束，无法恢复。':'撤销未成功：这批删除记录已处理。');expireNow();render();return;}
    if(!commit(result.state)){status('撤销未成功，请在倒计时结束前重试。');render();return;}
    status(`已恢复 ${result.count} 条资料。`);render();
  }
  $('add-form').addEventListener('submit',event=>{
    event.preventDefault();const name=$('material-name').value.trim();
    if(!name||name.length>120){$('add-error').textContent=!name?'请先输入资料名。':'资料名请控制在 120 个字符内。';$('add-error').hidden=false;$('material-name').setAttribute('aria-invalid','true');$('material-name').focus();return;}
    if(!readLatest()){render();return;}const now=Date.now(),next=core.add(core.expire(state,now).state,name,now,uid());
    if(!commit(next)){status('资料未添加，请重试。');render();return;}
    $('material-name').value='';$('add-error').hidden=true;$('material-name').setAttribute('aria-invalid','false');status($('search').value.trim()&&!core.search([next.items[next.items.length-1]],$('search').value).length?'资料已添加。清空搜索可查看。':'资料已添加。');render();$('material-name').focus();
  });
  $('material-name').addEventListener('input',()=>{$('add-error').hidden=true;$('material-name').setAttribute('aria-invalid','false');});
  $('search').addEventListener('input',renderList);
  $('select-all').addEventListener('change',()=>{const checked=$('select-all').checked;visible().forEach(item=>{if(checked)selected.add(item.id);else selected.delete(item.id);});renderList();$('select-all').focus();});
  $('delete').addEventListener('click',()=>{
    if(!readLatest()){render();return;}const now=Date.now(),result=core.remove(core.expire(state,now).state,[...selected],now,uid());
    if(!result.count){status('所选资料已不在列表中。');render();return;}
    if(!commit(result.state)){status('删除未成功，请重试。');render();return;}
    selected.clear();status(`已删除 ${result.count} 条资料，可在 30 秒内撤销。`);render();$('undo-stack').lastElementChild?.querySelector('button').focus();
  });
  $('retry').addEventListener('click',()=>{if(!readLatest()){render();return;}expireNow();render();if($('storage-error').hidden)status('已重新读取当前浏览器的资料。');});
  window.addEventListener('storage',event=>{if(event.key!==KEY&&event.key!==null)return;if(readLatest()){expireNow();status('资料已更新。');}render();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(readLatest())expireNow();render();}});
  readLatest();expireNow();render();
  setInterval(()=>{
    const now=Date.now();for(const card of $('undo-stack').children){const batch=state.pending.find(item=>item.id===card.dataset.batch);if(!batch)continue;card.querySelector('.timer').textContent=`${Math.max(0,Math.ceil((batch.expiresAt-now)/1000))}s`;if(now>=batch.expiresAt){const button=card.querySelector('button');button.disabled=true;button.textContent='已到期';}}
    if(!expiryRetry&&!readBlocked)expireNow();
  },250);
})();
</script>
</body>
</html>
