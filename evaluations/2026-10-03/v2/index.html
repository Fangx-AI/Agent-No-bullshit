<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片压缩</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#19263c;font:16px/1.6 system-ui,sans-serif}main{max-width:860px;margin:60px auto;padding:32px;background:white;border-radius:24px;box-shadow:0 12px 40px #2637540c}h1{margin:0;font-size:30px}p{color:#69768a}.pick{display:block;border:2px dashed #bac7df;border-radius:16px;padding:30px;text-align:center;margin:24px 0;cursor:pointer;background:#fafbff}.pick input{display:block;margin:16px auto;max-width:100%}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap}input[type=range]{flex:1;min-width:130px;accent-color:#4b60d4}button{background:#4b60d4;color:white;border:0;border-radius:10px;padding:12px 22px;font:inherit;cursor:pointer}button:disabled{background:#b5bdcc;cursor:default}#status{min-height:26px;margin:18px 0}.previews{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;min-width:0}img{width:100%;height:220px;object-fit:contain;border-radius:12px;background:repeating-conic-gradient(#edf0f5 0% 25%,#fff 0% 50%) 50%/20px 20px}figcaption{font-size:14px;margin-top:8px;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:600px){main{margin:16px;padding:22px}.previews{grid-template-columns:1fr}h1{font-size:26px}}
</style>
<main><h1>图片压缩</h1><p>选择 JPG 或 PNG，调整质量后下载。</p>
<label class="pick">选择图片<input id="file" type="file" accept="image/jpeg,image/png"></label>
<div class="controls"><label for="quality">质量 <output id="value">80%</output></label><input id="quality" type="range" min="10" max="100" value="80"><button id="download" disabled>下载压缩图片</button></div>
<p>输出 JPG；透明区域变为白色。</p><div id="status" role="status" aria-live="polite">等待选择图片</div>
<div class="previews" id="previews" hidden><figure><img id="original" alt="原图预览"><figcaption id="before"></figcaption></figure><figure><img id="result" alt="压缩图片预览"><figcaption id="after"></figcaption></figure></div></main>
<script>
const $=id=>document.getElementById(id);let revision=0,source=null,originalURL=null,resultURL=null,blob=null,name='';
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
function clearResult(){blob=null;$('download').disabled=true;if(resultURL)URL.revokeObjectURL(resultURL);resultURL=null;$('result').removeAttribute('src');$('after').textContent='';}
async function compress(token){clearResult();$('status').textContent='正在压缩…';try{const canvas=document.createElement('canvas');canvas.width=source.width;canvas.height=source.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(source,0,0);const output=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error()),'image/jpeg',Number($('quality').value)/100));if(token!==revision)return;blob=output;resultURL=URL.createObjectURL(output);$('result').src=resultURL;const change=(1-output.size/source.bytes)*100;$('after').textContent='压缩后 · '+size(output.size);$('status').textContent=change>=0?'已完成，减少 '+change.toFixed(1)+'%':'已完成，文件增加 '+(-change).toFixed(1)+'%，可降低质量再试';$('download').disabled=false;}catch{if(token===revision){clearResult();$('status').textContent='压缩失败，请调整质量重试或重新选择图片。';}}}
$('file').addEventListener('change',async()=>{const token=++revision;clearResult();source=null;$('previews').hidden=true;if(originalURL)URL.revokeObjectURL(originalURL);originalURL=null;const f=$('file').files[0];if(!f){$('status').textContent='等待选择图片';return;}if(!['image/jpeg','image/png'].includes(f.type)){$('status').textContent='请选择 JPG 或 PNG 图片。';return;}$('status').textContent='正在读取图片…';try{const url=URL.createObjectURL(f);originalURL=url;const img=new Image();img.src=url;await img.decode();if(token!==revision)return;if(img.naturalWidth*img.naturalHeight>40000000){throw new Error();}source=img;source.bytes=f.size;name=f.name.replace(/\.[^.]+$/,'');$('original').src=url;$('before').textContent='原图 · '+size(f.size)+' · '+img.naturalWidth+' × '+img.naturalHeight;$('previews').hidden=false;await compress(token);}catch{if(token===revision){source=null;$('status').textContent='无法读取图片，请选择有效的 JPG/PNG（最多 4000 万像素）。';}}});
$('quality').addEventListener('input',()=>{$('value').textContent=$('quality').value+'%';if(source)compress(++revision);});
$('download').addEventListener('click',()=>{if(!blob||!resultURL)return;const link=document.createElement('a');link.href=resultURL;link.download=name+'-compressed.jpg';document.body.append(link);link.click();link.remove();});
</script></html>
