<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地图片压缩</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f3f5f8;color:#15243a;margin:0;padding:32px}main{max-width:660px;margin:40px auto;background:white;padding:32px;border-radius:20px;box-shadow:0 12px 40px #15243a12}h1{margin-top:0}label{display:block;margin:20px 0 8px}input[type=range]{width:100%}button,.download{display:inline-block;background:#2457db;color:white;border:0;border-radius:10px;padding:12px 20px;font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:default}small{color:#56657c}#preview{max-width:100%;max-height:260px;display:block;margin:20px auto}#status{white-space:pre-line}a[hidden],img[hidden]{display:none}</style></head><body><main><h1>本地图片压缩</h1><p>选择 JPG 或 PNG 图片，调整质量后下载。图片只在此浏览器处理，不会上传。</p><label for="file">选择图片</label><input id="file" type="file" accept="image/jpeg,image/png"><label for="quality">JPEG 质量：<span id="value">80</span>%</label><input id="quality" type="range" min="10" max="100" value="80"><small>输出为 JPEG。PNG 透明区域会填充为白色；质量越低，文件通常越小。</small><p><button id="compress" disabled>压缩图片</button></p><p id="status" role="status" aria-live="polite">尚未选择图片。</p><img id="preview" hidden alt="压缩后的图片预览"><a id="download" class="download" hidden>下载压缩图片</a></main><script>
const file=document.querySelector('#file'),quality=document.querySelector('#quality'),value=document.querySelector('#value'),button=document.querySelector('#compress'),status=document.querySelector('#status'),preview=document.querySelector('#preview'),download=document.querySelector('#download');let outputUrl,version=0;
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
function reset(){if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=null;download.hidden=true;preview.hidden=true;preview.removeAttribute('src')}
quality.oninput=()=>{value.textContent=quality.value;version++;reset();if(file.files[0])status.textContent='质量已调整，请重新压缩。'};
file.onchange=()=>{version++;reset();const f=file.files[0];button.disabled=!f||!['image/jpeg','image/png'].includes(f.type);status.textContent=!f?'尚未选择图片。':button.disabled?'请选择 JPG 或 PNG 图片。':`已选择：${f.name}\n原始大小：${size(f.size)}`};
button.onclick=async()=>{const f=file.files[0],job=++version;reset();button.disabled=true;status.textContent='正在处理…';let source;try{source=URL.createObjectURL(f);const img=new Image();img.src=source;await img.decode();if(job!==version)return;const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;if(!canvas.width||!canvas.height)throw Error();const ctx=canvas.getContext('2d');if(!ctx)throw Error();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',Number(quality.value)/100));if(job!==version)return;if(!blob||blob.type!=='image/jpeg')throw Error();outputUrl=URL.createObjectURL(blob);preview.src=outputUrl;preview.hidden=false;download.href=outputUrl;download.download=f.name.replace(/\.[^.]+$/,'')+'-压缩.jpg';download.hidden=false;const percent=(1-blob.size/f.size)*100;status.textContent=`原始：${size(f.size)} → 压缩后：${size(blob.size)}\n${percent>0?'体积减少 '+percent.toFixed(1)+'%':'结果未变小，可降低质量再试。'}\n尺寸：${canvas.width} × ${canvas.height}`;}catch(e){if(job===version)status.textContent='处理失败：图片可能损坏、格式不支持，或尺寸超出浏览器内存限制。请尝试较小的 JPG/PNG 图片。'}finally{if(source)URL.revokeObjectURL(source);button.disabled=!file.files[0]||!['image/jpeg','image/png'].includes(file.files[0].type)}};
window.addEventListener('beforeunload',reset);
</script></body></html>
