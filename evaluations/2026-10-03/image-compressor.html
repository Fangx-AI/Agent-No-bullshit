<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片压缩</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f6fa;color:#182232;margin:0;padding:32px}main{max-width:620px;margin:auto;background:white;padding:28px;border-radius:16px}h1{margin-top:0}label{display:block;margin:20px 0 8px}input[type=file]{width:100%}input[type=range]{width:100%}select,button,a{font:inherit;padding:10px 16px;border-radius:8px}button,a{background:#2557db;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{display:inline-block;text-decoration:none;margin-top:12px}a[hidden]{display:none}img{max-width:100%;max-height:280px;margin-top:20px}#status{line-height:1.7;white-space:pre-line}small{color:#536174}</style>
<main><h1>图片压缩</h1><p>选择 JPG 或 PNG，调整质量后下载。</p><label for="file">选择图片</label><input id="file" type="file" accept="image/jpeg,image/png"><label for="format">输出格式</label><select id="format"><option value="image/jpeg">JPG（透明区域变为白色）</option><option value="image/png">PNG（保留透明背景）</option></select><label for="quality">JPG 质量：<span id="value">80</span>%</label><input id="quality" type="range" min="10" max="100" value="80"><small id="hint">质量越低，文件通常越小。</small><p><button id="compress" disabled>压缩图片</button></p><p id="status" role="status" aria-live="polite">尚未选择图片。</p><a id="download" hidden>下载图片</a><img id="preview" alt="压缩结果预览" hidden></main>
<script>
const $=id=>document.getElementById(id);let source=null,outputUrl=null,inputUrl=null,revision=0;
const size=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB';
function resetOutput(){if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=null;$('download').hidden=true;$('preview').hidden=true;$('preview').removeAttribute('src')}
$('quality').oninput=()=>{$('value').textContent=$('quality').value;resetOutput()};
$('format').onchange=()=>{const png=$('format').value==='image/png';$('quality').disabled=png;$('hint').textContent=png?'PNG 使用无损编码，质量滑块不适用，结果可能比原图更大。':'质量越低，文件通常越小。';resetOutput()};
$('file').onchange=async()=>{const current=++revision;source=null;resetOutput();$('compress').disabled=true;const file=$('file').files[0];if(!file){$('status').textContent='尚未选择图片。';return}if(!['image/jpeg','image/png'].includes(file.type)){$('status').textContent='请选择 JPG 或 PNG 图片。';return}if(inputUrl)URL.revokeObjectURL(inputUrl);inputUrl=URL.createObjectURL(file);const img=new Image();try{img.src=inputUrl;await img.decode();if(current!==revision)return;if(!img.naturalWidth||!img.naturalHeight)throw Error();source={file,img};$('status').textContent=`原图：${size(file.size)} · ${img.naturalWidth} × ${img.naturalHeight}`;$('compress').disabled=false}catch{if(current===revision)$('status').textContent='无法读取这张图片，请换一张 JPG 或 PNG。'}};
$('compress').onclick=async()=>{if(!source)return;const current=revision,selected=source;resetOutput();$('compress').disabled=true;$('status').textContent='正在压缩…';try{const canvas=document.createElement('canvas');canvas.width=selected.img.naturalWidth;canvas.height=selected.img.naturalHeight;const ctx=canvas.getContext('2d');if(!ctx)throw Error();const type=$('format').value;if(type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(selected.img,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,type,Number($('quality').value)/100));if(current!==revision)return;if(!blob)throw Error();outputUrl=URL.createObjectURL(blob);$('download').href=outputUrl;$('download').download=selected.file.name.replace(/\.[^.]+$/,'')+'-压缩.'+(type==='image/jpeg'?'jpg':'png');$('download').hidden=false;$('preview').src=outputUrl;$('preview').hidden=false;const saved=(1-blob.size/selected.file.size)*100;$('status').textContent=`原图：${size(selected.file.size)}\n结果：${size(blob.size)} · ${saved>=0?'减少 '+saved.toFixed(1)+'%':'比原图大 '+(-saved).toFixed(1)+'%，可降低 JPG 质量后重试。'}`}catch{if(current===revision)$('status').textContent='压缩失败，图片可能过大。请缩小图片尺寸后重试。'}finally{if(current===revision)$('compress').disabled=!source}};
</script></html>
