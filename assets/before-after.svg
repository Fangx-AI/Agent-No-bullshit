<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">上传图片：修改前与修改后</title>
<desc id="desc">相同样式的上传界面，修改后删掉无依据的说明与重复确认，保留选择图片按钮和文件限制。</desc>
<defs><style>text{font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.body{font-size:22px;fill:#68707a}.label{font-size:22px;fill:#68707a}</style></defs>
<rect width="1440" height="800" fill="#fff"/>
<text x="48" y="64" font-size="30" font-weight="700" fill="#202124">上传图片</text>
<text x="48" y="104" class="body">删掉无依据的说明和重复确认，保留操作需要的信息。</text>
<path d="M48 134H1392" stroke="#e2e5e9"/>
<text x="48" y="178" class="label">修改前</text><text x="760" y="178" class="label">修改后</text>
<rect x="48" y="204" width="632" height="490" rx="4" fill="#fff" stroke="#d5d9de"/>
<rect x="760" y="204" width="632" height="490" rx="4" fill="#fff" stroke="#d5d9de"/>
<text x="84" y="266" font-size="27" font-weight="700" fill="#202124">上传图片</text>
<text x="796" y="266" font-size="27" font-weight="700" fill="#202124">上传图片</text>
<rect x="84" y="296" width="560" height="134" rx="2" fill="#f6f7f8"/>
<text x="104" y="332" font-size="20" fill="#555c65">请确保您拥有上传内容的合法权利，</text>
<text x="104" y="364" font-size="20" fill="#555c65">并已充分了解相关隐私及数据处理风险。</text>
<text x="104" y="396" font-size="20" fill="#555c65">继续使用即表示您理解并承担相应责任。</text>
<rect x="84" y="461" width="20" height="20" rx="2" fill="#fff" stroke="#8b929a"/>
<text x="120" y="479" font-size="20" fill="#434951">我已阅读并同意以上说明</text>
<rect x="84" y="506" width="20" height="20" rx="2" fill="#fff" stroke="#8b929a"/>
<text x="120" y="524" font-size="20" fill="#434951">我再次确认上传内容符合要求</text>
<rect x="84" y="566" width="182" height="49" rx="4" fill="#f0f1f3" stroke="#d5d9de"/>
<text x="175" y="598" text-anchor="middle" font-size="21" fill="#969ba3">确认并继续</text>
<text x="84" y="654" font-size="19" fill="#68707a">支持 JPG、PNG，最大 10 MB</text>
<text x="796" y="310" class="body">支持 JPG、PNG，最大 10 MB</text>
<rect x="796" y="346" width="182" height="49" rx="4" fill="#202124"/>
<text x="887" y="378" text-anchor="middle" font-size="21" fill="#fff">选择图片</text>
<path d="M48 733H1392" stroke="#e2e5e9"/>
<text x="48" y="773" font-size="19" fill="#68707a">界面示意 · 格式与大小限制以实际产品为准</text>
</svg>
