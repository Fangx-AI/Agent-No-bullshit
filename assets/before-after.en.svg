<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Image upload: before and after</title>
<desc id="desc">Matching upload interfaces. The revised version removes unsupported notices and duplicate confirmations, keeping the upload button and file limits.</desc>
<defs><style>text{font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.body{font-size:22px;fill:#68707a}.label{font-size:22px;fill:#68707a}</style></defs>
<rect width="1440" height="800" fill="#fff"/>
<text x="48" y="64" font-size="30" font-weight="700" fill="#202124">Upload an image</text>
<text x="48" y="104" class="body">Remove unsupported notices and duplicate confirmations. Keep what users need to act.</text>
<path d="M48 134H1392" stroke="#e2e5e9"/>
<text x="48" y="178" class="label">Before</text><text x="760" y="178" class="label">After</text>
<rect x="48" y="204" width="632" height="490" rx="4" fill="#fff" stroke="#d5d9de"/>
<rect x="760" y="204" width="632" height="490" rx="4" fill="#fff" stroke="#d5d9de"/>
<text x="84" y="266" font-size="27" font-weight="700" fill="#202124">Upload an image</text>
<text x="796" y="266" font-size="27" font-weight="700" fill="#202124">Upload an image</text>
<rect x="84" y="296" width="560" height="134" rx="2" fill="#f6f7f8"/>
<text x="104" y="332" font-size="20" fill="#555c65">Please confirm you hold the rights to this content,</text>
<text x="104" y="364" font-size="20" fill="#555c65">and understand the privacy and data handling risks.</text>
<text x="104" y="396" font-size="20" fill="#555c65">By continuing, you accept the associated responsibility.</text>
<rect x="84" y="461" width="20" height="20" rx="2" fill="#fff" stroke="#8b929a"/>
<text x="120" y="479" font-size="20" fill="#434951">I have read and agree to the notice above</text>
<rect x="84" y="506" width="20" height="20" rx="2" fill="#fff" stroke="#8b929a"/>
<text x="120" y="524" font-size="20" fill="#434951">I confirm again that this upload meets the requirements</text>
<rect x="84" y="566" width="182" height="49" rx="4" fill="#f0f1f3" stroke="#d5d9de"/>
<text x="175" y="598" text-anchor="middle" font-size="21" fill="#969ba3">Confirm upload</text>
<text x="84" y="654" font-size="19" fill="#68707a">JPG or PNG, up to 10 MB</text>
<text x="796" y="310" class="body">JPG or PNG, up to 10 MB</text>
<rect x="796" y="346" width="182" height="49" rx="4" fill="#202124"/>
<text x="887" y="378" text-anchor="middle" font-size="21" fill="#fff">Choose image</text>
<path d="M48 733H1392" stroke="#e2e5e9"/>
<text x="48" y="773" font-size="19" fill="#68707a">Illustrative UI · File types and size limits depend on the actual product</text>
</svg>
